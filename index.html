&lt;style&gt;
  /* ============================================================
     TOKENS — Bumpy chrome stays monochrome; the EVENT owns the accent.
     data-event-theme switches the artwork-extracted palette.
     ============================================================ */
  :root {
    /* ---- Surfaces: the depth ladder. well &lt; bg &lt; glass (recessed → floating) */
    --bg: #0a0a0c;
    --well: #050507;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-2: rgba(255, 255, 255, 0.08);
    /* ---- Ink */
    --ink: #f6f5f4;
    --ink-2: #a8a29e;
    --ink-3: #8a8481;
    /* ---- Hairlines */
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.05);
    /* ---- Semantic state. Independent of the artwork accent, on purpose:
           green always means &quot;you saved&quot;, red always means &quot;fix this&quot;. */
    --pos: #34d399;
    --pos-soft: rgba(52, 211, 153, 0.8);
    --warn: #ffc46b;
    --danger: #ff8a8a;
    /* ---- Shape + motion */
    --r-lg: 1.35rem;
    --r-xl: 1.65rem;
    --r-pill: 999px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1); /* ease-out-quint */
    --dur: 220ms;
    /* ---- Label tiers. Two, not six. */
    --label: 0.72rem;     /* section labels: ABOUT, TICKETS, ORDER SUMMARY */
    --label-sm: 0.64rem;  /* micro: WHEN/WHERE, field labels, chips, pills */
    /* ---- The one CTA */
    --cta-size: 0.92rem;

    /* Accent stays fixed orange; poster artwork is a separate (non-orange) palette */
    --accent: #e7ff1a;
    --glow: #f2ff7d;
    --accent-ink: #1a2300;
    /* Poster artwork — cool blue hero */
    --sky-a: #0e1f3a;
    --sky-b: #2a63b8;
    --sky-c: #7fd6ec;
    --sea: #0a1526;
  }
  [data-event-theme=&quot;acid&quot;] {
    --accent: #c6f543;
    --glow: #59f0c6;
    --accent-ink: #101a02;
    --sky-a: #05140d;
    --sky-b: #103d2a;
    --sky-c: #c6f543;
    --sea: #061a12;
  }
  [data-event-theme=&quot;midnight&quot;] {
    --accent: #8b7cff;
    --glow: #4da6ff;
    --accent-ink: #0d0824;
    --sky-a: #0a0724;
    --sky-b: #2b1f6e;
    --sky-c: #4da6ff;
    --sea: #0a0a2e;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
  body {
    margin: 0;
    /* containing block for the ambient scrim/floor, so their `bottom: 0`
       resolves against the whole document rather than the viewport
       (production nests the same layers inside a `relative` wrapper) */
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif;
    font-variant-numeric: tabular-nums;  /* one numeric system across the funnel */
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ============================================================
     AMBIENT BACKDROP — the event artwork itself, blurred behind the
     page. Mirrors production's three-layer stack in EventPageClient.tsx:
       1. the hero image, fixed, 100vw x 800px, blur(30px) scale(1.1),
          object-position top
       2. a gradient scrim fading it to black over those 800px
       3. solid page background below
     No accent wash — the artwork supplies the colour.
     ============================================================ */
  .ambient {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 800px;
    z-index: -2;
    overflow: hidden;
    /* production animates opacity 0-&gt;1 and scale 1.15-&gt;1.1 as the image lands */
    animation: ambient-in 1200ms var(--ease) both;
  }
  .ambient &gt; * {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    filter: blur(30px);
    transform: scale(1.1);
  }
  /* Layer 2 — scrolls with the page like production's absolute overlay, so the
     fixed artwork behind it slides out of view rather than following you down. */
  .ambient-scrim {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 800px;
    z-index: -1;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,1) 100%);
    pointer-events: none;
  }
  /* Layer 3 — the fixed artwork never scrolls away on its own, so this panel
     covers it from 800px down (production does the same with a black div).
     Without it the blur would sit behind the whole page, not just the top. */
  .ambient-floor {
    position: absolute;
    top: 800px;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    z-index: -1;
    background: var(--bg);
    pointer-events: none;
  }
  @keyframes ambient-in {
    from { opacity: 0; transform: scale(1.045); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ambient { animation: none; }
  }

  /* ============================================================ HEADER */
  .hdr {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem clamp(1rem, 4vw, 3rem);
    transition: background var(--dur) ease, border-color var(--dur) ease, backdrop-filter var(--dur) ease;
    border-bottom: 1px solid transparent;
  }
  .hdr.scrolled {
    background: rgba(10, 10, 12, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom-color: var(--line);
  }

  .hdr nav { display: flex; gap: 0.4rem; align-items: center; }
  .navlink {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 600;
    transition: opacity var(--dur) ease;
  }
  .navlink:hover { opacity: 0.7; }
  /* bigger header on desktop */
  @media (min-width: 1024px) {
    .hdr { padding-top: 1.2rem; padding-bottom: 1.2rem; }
    .wordmark { font-size: 1.6rem; }
    .navlink { font-size: 1.05rem; }
  }

  /* ============================================================ LAYOUT */
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.5rem) clamp(1rem, 4vw, 3rem) 3rem;
    display: grid;
    grid-template-columns: minmax(300px, 400px) 1fr;
    gap: clamp(1.5rem, 4vw, 3.5rem);
    align-items: start;
  }
  @media (max-width: 880px) {
    .wrap { grid-template-columns: 1fr; }
    /* 7rem of tail padding is desktop breathing room; on mobile it just opened a
       dead band between the last FAQ row and the footer. */
    .wrap { padding-bottom: 2rem; }
  }

  /* ============================================================ POSTER */
  .poster-col { position: sticky; top: 5.2rem; }
  @media (max-width: 880px) {
    .poster-col { position: static; max-width: 420px; margin: 0 auto; width: 100%; }
  }
  .poster {
    position: relative;
    border-radius: var(--r-xl);
    overflow: hidden;
    aspect-ratio: 1;
    box-shadow: 0 24px 70px -30px rgba(0, 0, 0, 0.7);
    transition: box-shadow 600ms var(--ease);
  }
  .poster svg, .poster img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .share {
    position: absolute;
    bottom: 0.8rem;
    right: 0.8rem;
    width: 2.4rem;
    height: 2.4rem;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(6px);
    display: grid;
    place-items: center;
    transition: background var(--dur) ease;
  }
  .share:hover { background: rgba(0, 0, 0, 0.75); }
  .going {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    justify-content: center;
    color: var(--ink-2);
    font-size: 0.85rem;
  }
  .faces { display: flex; }
  .face {
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 50%;
    border: 2px solid var(--bg);
    margin-left: -0.5rem;
    background: linear-gradient(135deg, var(--glow), var(--accent));
    display: grid;
    place-items: center;
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--accent-ink);
  }
  .face:first-child { margin-left: 0; }

  /* ============================================================ RIGHT RAIL */
  .title {
    font-family: 'TitleStack', system-ui, sans-serif;
    font-size: clamp(2.9rem, 7vw, 5.4rem);
    font-weight: 400;      /* Anton ships one weight; faux-bold would smear it */
    letter-spacing: 0.004em;
    line-height: 1.02;
    margin: 0 0 1.4rem;
    text-wrap: balance;
    text-shadow: 0 4px 70px color-mix(in oklab, var(--accent) 32%, transparent);
  }

  .card {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .info {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .info &gt; * {
    padding: 1.05rem 1.1rem 1.05rem 0;
    border-left: 1px solid var(--line);
    min-width: 0;
  }
  .info &gt; *:first-child { border-left: none; }
  .info &gt; *:not(:first-child) { padding-left: 1.1rem; }
  @media (max-width: 640px) {
    .info { grid-template-columns: 1fr; }
    .info &gt; * { border-left: none; border-top: 1px solid var(--line); padding-left: 0; }
    .info &gt; *:first-child { border-top: none; }
    .info &gt; *:not(:first-child) { padding-left: 0; }
  }
  .info .k {
    font-size: var(--label-sm);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 0.35rem;
    font-weight: 600;
  }
  .info .v { font-size: 0.92rem; font-weight: 600; margin: 0; }
  .info .s { font-size: 0.78rem; color: var(--ink-2); margin: 0.15rem 0 0; }
  .info button {
    all: unset;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    cursor: pointer;
    padding: 1.05rem 1.1rem;
    border-left: 1px solid var(--line);
    transition: background var(--dur) ease;
  }
  .info button:hover { background: var(--glass); }
  @media (max-width: 640px) {
    .info button { border-left: none; border-top: 1px solid var(--line); padding: 1.05rem 0; }
    /* Stacked full-width rows wasted the whole right half and cost four lines
       each. Put the label/value/sub in one column and pull the action cue into
       that dead space, centred against the block — one line shorter per cell. */
    .info button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        &quot;k cue&quot;
        &quot;v cue&quot;
        &quot;s cue&quot;;
      align-items: center;
      column-gap: 1rem;
    }
    .info button &gt; .k { grid-area: k; }
    .info button &gt; .v,
    .info button &gt; .org-inline { grid-area: v; }
    .info button &gt; .s { grid-area: s; }
    .info button &gt; .where-cue { grid-area: cue; margin-top: 0; justify-self: end; }
  }
  .info button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* The affordance production is missing: say there's a map behind this. */
  .where-cue {
    display: inline-flex; align-items: center; gap: 0.25rem;
    margin-top: 0.45rem;
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-3);
    transition: color var(--dur) ease;
  }
  .info button:hover .where-cue { color: var(--glow); }

  .about-rule { border: 0; border-top: 1px solid var(--line); margin: 1.4rem 0; }

  /* ============================================================ MAP SHEET
     Bottom sheet on mobile, centred dialog on desktop — production's shape.
     The map is only built when opened, so it costs nothing on page load. */
  .sheet-scrim {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur) ease;
  }
  .sheet-scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; z-index: 61; left: 0; right: 0; bottom: 0;
    background: #111; border-top: 1px solid var(--line);
    border-radius: 1.75rem 1.75rem 0 0;
    box-shadow: 0 -24px 80px rgba(0, 0, 0, 0.48);
    transform: translateY(100%);
    transition: transform 260ms var(--ease);
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    pointer-events: none;
  }
  .sheet.on { transform: none; pointer-events: auto; }
  @media (min-width: 1024px) {
    .sheet {
      left: 50%; right: auto; top: 50%; bottom: auto;
      width: min(92vw, 640px); border-radius: 1.75rem;
      border: 1px solid var(--line); max-height: 86vh;
      transform: translate(-50%, -50%) scale(0.96); opacity: 0;
      transition: transform 220ms var(--ease), opacity 220ms ease;
    }
    .sheet.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .sheet-grab { display: flex; justify-content: center; padding: 0.75rem 0; }
  .sheet-grab i { width: 2.5rem; height: 4px; border-radius: var(--r-pill); background: rgba(255,255,255,0.2); }
  @media (min-width: 1024px) { .sheet-grab { display: none; } }
  .sheet-map { height: 220px; background: var(--well); position: relative; }
  .sheet-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sheet-body { padding: 1.1rem 1.3rem 1.5rem; }
  .sheet-body h3 { margin: 0 0 0.2rem; font-size: 1.05rem; }
  .sheet-addr { margin: 0; color: var(--ink-2); font-size: 0.88rem; }
  .sheet-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; }
  .sheet-actions button {
    flex: 1; padding: 0.8rem 1rem; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; font-size: 0.85rem; font-weight: 650; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    transition: background var(--dur) ease;
  }
  .sheet-actions button:hover { background: var(--glass); }
  .sheet-actions button.primary {
    border-color: transparent; color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    font-weight: 800;
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-scrim { transition: none; }
  }

  /* ============================================================ TICKET RAIL */
  .price-card {
    padding: 1.4rem 0;

    align-items: center;
    justify-content: space-between;
    gap: 1rem;

  .price-amount {

  /* &quot;From&quot; when the event has more than one available regular price —

  .price-amount .from {
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--ink-2);
  }
  .bar .sum b .from {
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--ink-2);
  }
  .price-detail { margin: 0.1rem 0 0; color: var(--ink-2); font-size: 0.82rem; }
  /* Mobile: pricing lives in the sticky bar only */
  @media (max-width: 880px) {
    .price-card { display: none; }
    /* The bar is permanently docked at this width, so the page must reserve its
       height — `footer.site` already carries 6.5rem of bottom padding for exactly
       that (&gt; the 76px bar), so nothing extra is needed here. */
  }
  .rail { margin-top: 1.1rem; padding: 1.15rem; }
  .rail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.9rem;
  }
  .rail-head h2 { font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; }
  .countdown {
    font-size: 0.74rem;
    font-weight: 700;
    padding: 0.3rem 0.7rem;
    border-radius: var(--r-pill);
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .tier {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.95rem 0.9rem;
    border-radius: 1rem;
    border: 1px solid transparent;
    transition: background var(--dur) ease, border-color var(--dur) ease;
  }
  .tier + .tier { margin-top: 0.35rem; }
  .tier:not(.off):hover { background: var(--glass); }
  .tier.picked { background: var(--glass); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
  .tier.off { opacity: 0.55; }
  .tier-info { flex: 1; min-width: 0; }
  .tier-name { font-weight: 700; font-size: 0.98rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .chip {
    font-size: var(--label-sm);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.18rem 0.55rem;
    border-radius: var(--r-pill);
  }
  .chip.low { background: color-mix(in oklab, var(--accent) 22%, transparent); color: var(--glow); }
  .chip.dead { background: var(--glass-2); color: var(--ink-2); }
  .tier-desc { font-size: 0.8rem; color: var(--ink-2); margin-top: 0.15rem; }
  .tier-price { font-weight: 800; font-size: 1.05rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tier-price small { font-weight: 600; font-size: 0.68rem; color: var(--ink-2); margin-left: 0.2rem; }
  .qty { display: flex; align-items: center; gap: 0.55rem; }
  .qty span { min-width: 1.1rem; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .qty button {
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    border: 1px solid var(--line);

  .qty button.plus { background: var(--ink); color: #111; border-color: transparent; font-weight: 700; }
  .qty button:hover:not(:disabled) { transform: scale(1.08); }
  .qty button:disabled { opacity: 0.3; cursor: not-allowed; }
  .qty button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) {
    .tier { flex-wrap: wrap; row-gap: 0.55rem; }

    .tier-price { margin-right: auto; }

  /* ============================================================ SECTIONS */
  section.block { margin-top: 2.2rem; }
  section.block + section.block {
    border-top: 1px solid var(--line);
    padding-top: 2.2rem;
  }
  section.block &gt; h2 {
    font-size: var(--label);
    font-weight: 700;
    text-transform: uppercase;

  }
  .about p { color: var(--ink-2); max-width: 62ch; margin: 0 0 0.9rem; }
  .about p strong { color: var(--ink); font-weight: 600; }

  .lineup { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .artist {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.45rem 0.9rem 0.45rem 0.5rem;
    border-radius: var(--r-pill);
    background: var(--glass);
    border: 1px solid var(--line);
    font-size: 0.88rem;
    font-weight: 600;
  }
  .dj {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    /* fixed row height so a row with a photo and one without match exactly —
       the photo (2.1rem) no longer dictates the height */
    min-height: 3.7rem;
    padding: 0.3rem;
    border-radius: 0.6rem;
    color: var(--ink);
    text-decoration: none;
    transition: background var(--dur) ease;
  }
  .dj + .dj { border-top: 1px solid var(--line); }
  a.dj:hover { background: var(--glass); }
  a.dj:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .dj-name { font-weight: 600; font-size: 0.95rem; flex: 1; min-width: 0; }
  /* Artist photo comes from the Spotify artist object's `images` array.
     That array is EMPTY for most small/local DJs — so there is no initials
     fallback: either a real photo or nothing. Initials next to real faces
     read as broken; absence reads as &quot;no photo&quot;. */
  .dj img {
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--glass);
  }
  /* The avatar column is only reserved when at least ONE artist in this
     line-up has a photo. An all-photoless line-up gets a clean flush-left
     list instead of a column of empty gaps. */
  .djlist.has-photos .dj:not(.has-photo)::before {
    content: &quot;&quot;;
    width: 2.1rem;
    flex-shrink: 0;
  }
  .sp { color: #1db954; display: grid; place-items: center; flex-shrink: 0; }
  .artist i {
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--glass-2), color-mix(in oklab, var(--accent) 35%, transparent));
    display: grid;
    place-items: center;
    font-style: normal;
    font-size: 0.66rem;
    font-weight: 800;
    color: var(--ink);
  }


  details.faq { border-bottom: 1px solid var(--line); }
  details.faq summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 0.2rem;
    font-weight: 600;
    font-size: 0.92rem;
  }
  details.faq summary::-webkit-details-marker { display: none; }
  details.faq summary::after {
    content: &quot;+&quot;;
    font-size: 1.2rem;
    color: var(--ink-3);
    transition: transform var(--dur) var(--ease);
  }
  details.faq[open] summary::after { transform: rotate(45deg); }
  details.faq div { padding: 0 0.2rem 1rem; color: var(--ink-2); font-size: 0.88rem; max-width: 60ch; }

  .org-inline { display: flex; align-items: center; gap: 0.55rem; }
  /* The producer's own mark, not initials on the Bumpy accent — the accent is
     reserved for &quot;your choice&quot;, and this slot belongs to the producer. */
  .org-inline i {
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;

  .ntk { display: flex; gap: 0.95rem; align-items: flex-start; }
  .ntk-ico {
    width: 2.3rem;
    height: 2.3rem;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    color: var(--ink-2);
    flex-shrink: 0;
  }

  .ntk-t strong { font-weight: 700; }
  .ntk-s { margin: 0.25rem 0 0; color: var(--ink-2); font-size: 0.88rem; }
  .org {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 1.2rem 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .org i {
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--glow), var(--accent));
    display: grid;
    place-items: center;
    font-style: normal;
    font-weight: 800;
    color: var(--accent-ink);
  }
  .org .k { font-size: var(--label-sm); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); margin: 0; font-weight: 600; }
  .org .v { font-weight: 700; margin: 0.1rem 0 0; }
  .org button {
    margin-left: auto;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 0.45rem 1rem;
    border-radius: var(--r-pill);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--dur) ease;
  }
  .org button:hover { background: var(--glass-2); }

  /* ============================================================ STICKY BAR */
  /* status pill on the sticky bar (non-buyable states) */
  .statepill { flex-shrink: 0; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 1rem; border-radius: var(--r-pill); background: var(--glass-2); color: var(--ink-2); }
  .statepill.soon { color: var(--glow); } .statepill.sold { color: var(--danger); } .statepill.paused { color: var(--warn); }
  .statepill[hidden] { display: none; }
  /* DEMO: floating state switcher */
  .demo-states { position: fixed; left: 50%; bottom: 5rem; transform: translateX(-50%); z-index: 60;
    display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 1.4rem);
    padding: 0.35rem; background: rgba(16,16,18,0.92); border: 1px solid var(--line); border-radius: 1.2rem;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 16px 40px -14px rgba(0,0,0,0.7); }
  .demo-states button { border: none; background: transparent; color: var(--ink-3); font: inherit; font-size: 0.74rem; font-weight: 600; padding: 0.4rem 0.7rem; border-radius: 0.85rem; cursor: pointer; white-space: nowrap; transition: background 0.18s, color 0.18s; }
  .demo-states button:hover { color: var(--ink-2); }
  .demo-states button.on { background: var(--glass-2); color: var(--ink); }

  /* Full-bleed dock: flush to both sides and the bottom edge, square corners.
     A soft upward shadow + hairline lifts it off the page so it never blends
     into the artwork backdrop behind it. */
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.05rem clamp(1rem, 4vw, 1.5rem);
    /* keeps it clear of the home indicator without breaking the flush edge */
    padding-bottom: calc(1.05rem + env(safe-area-inset-bottom, 0px));
    border-radius: 0;
    background: rgba(14, 14, 16, 0.92);
    border: none;
    border-top: 1px solid var(--line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 -10px 28px -8px rgba(0, 0, 0, 0.7);
    transition: transform 320ms var(--ease), opacity 320ms ease;
  }
  .bar.hide {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
  }
  /* Desktop: the full-bleed dock is a mobile answer — at this width it would be
     a 1400px-wide slab for two short strings. Back to a centred pill that floats
     clear of the bottom edge. (Mobile keeps the dock: it's the only CTA there.) */
  @media (min-width: 881px) {
    .bar {
      left: 50%;
      right: auto;
      bottom: 1.25rem;
      transform: translateX(-50%);
      width: min(560px, calc(100vw - 3rem));
      padding: 0.8rem 0.8rem 0.8rem 1.35rem;
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      box-shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.75);
    }
    /* .bar.hide outranks a plain .bar, so the centring has to be repeated here
       or the bar would slide out from the left edge instead of straight down. */
    .bar.hide { transform: translateX(-50%) translateY(160%); }
  }
  .bar .sum { line-height: 1.25; min-width: 0; flex: 1; padding-right: 0.5rem; }
  /* always one line each → the bar keeps a constant height across states */
  .bar .sum b { font-size: 1.02rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .sum small { display: block; margin-top: 0.22rem; color: var(--ink-2); font-size: 0.76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .cta { padding: 0.78rem 1.35rem; font-size: 0.88rem; }
  .cta {
    border: none;
    cursor: pointer;
    font-weight: 800;
    font-size: var(--cta-size);
    letter-spacing: 0.01em;
    padding: 0.8rem 1.2rem;
    border-radius: var(--r-pill);
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    box-shadow: 0 6px 24px -6px color-mix(in oklab, var(--accent) 70%, transparent);
    transition: transform 140ms var(--ease), box-shadow 140ms ease;
    white-space: nowrap;
  }
  .cta:hover { transform: translateY(-1px) scale(1.02); }
  .cta:active { transform: scale(0.98); }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .toast {
    position: fixed;
    bottom: 8.4rem;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    z-index: 70;
    background: var(--ink);
    color: #111;
    font-size: 0.84rem;
    font-weight: 600;
    padding: 0.6rem 1.1rem;
    border-radius: var(--r-pill);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) ease, transform var(--dur) var(--ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================ ENTRANCE
     One orchestrated moment; content is visible without JS
     (animation only ADDS, never gates). */
  @media (prefers-reduced-motion: no-preference) {
    .poster { animation: settle 500ms var(--ease) both; }
    .title { animation: rise 450ms var(--ease) 80ms both; }
    .info, .price-card { animation: rise 450ms var(--ease) 140ms both; }
    @keyframes settle {
      from { opacity: 0; transform: scale(1.03); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }

  footer.site {
    border-top: 1px solid var(--line);
    margin-top: 0;
    background: var(--well);
    /* extra bottom clearance so the © row isn't hidden by the sticky BUY NOW bar */
    padding: 3.5rem clamp(1rem, 4vw, 3rem) 6.5rem;
  }
  .foot-in {
    max-width: 1180px; margin: 0 auto;
    display: grid; grid-template-columns: 1.25fr 2fr; gap: clamp(2rem, 5vw, 4rem);
  }
  .foot-brand .wordmark { font-size: 1.5rem; }
  .foot-tag { color: var(--ink-2); font-size: 0.9rem; line-height: 1.55; margin: 1rem 0 1.3rem; max-width: 30ch; }
  .foot-social { display: flex; gap: 0.5rem; }
  .foot-social a {
    width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--line); color: var(--ink-2);
    transition: color var(--dur) ease, background var(--dur) ease, transform var(--dur) ease;
  }
  .foot-social a:hover { color: var(--ink); background: var(--glass-2); transform: translateY(-2px); }
  .foot-social a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .foot-cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem 1rem; }
  .foot-h {
    font-size: var(--label-sm); font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-2); margin: 0 0 0.9rem;
  }
  .foot-col a {
    display: block; color: var(--ink-3); text-decoration: none;
    font-size: 0.86rem; padding: 0.32rem 0; transition: color var(--dur) ease;
  }
  .foot-col a:hover { color: var(--ink); }
  .foot-bottom {
    max-width: 1180px; margin: 3rem auto 0; padding-top: 1.5rem;
    border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8rem 1.5rem; flex-wrap: wrap; color: var(--ink-3); font-size: 0.78rem;
  }
  .foot-legal { display: flex; gap: 1.3rem; flex-wrap: wrap; }
  .foot-legal a { color: var(--ink-3); text-decoration: none; }
  .foot-legal a:hover { color: var(--ink-2); }
  @media (max-width: 760px) {
    .foot-in { grid-template-columns: 1fr; gap: 2.2rem; }
    .foot-cols { grid-template-columns: repeat(2, 1fr); }
  }

    on_sale:    { t: &quot;1,390 THB&quot;, from: true, d: &quot;Secure your spot today.&quot;,              buy: true },

      &quot;DTEND;TZID=Asia/Bangkok:20260715T220000&quot;,
      &quot;SUMMARY:Afterlight Bangkok&quot;,
      &quot;LOCATION:FVTURE\\, Bangkok\\, Thailand&quot;,
      &quot;DESCRIPTION:Presented by Afterlight&quot;,
      &quot;END:VEVENT&quot;, &quot;END:VCALENDAR&quot;,

    const url = URL.createObjectURL(new Blob([ics], { type: &quot;text/calendar;charset=utf-8&quot; }));

  // The clone is stripped of ids/labels so it can't be announced or collide
  // with the original's gradient ids.
  (() =&gt; {
    const art = document.querySelector(&quot;.poster &gt; svg, .poster &gt; img&quot;);
    const slot = document.querySelector(&quot;.ambient&quot;);
    if (!art || !slot) return;
    const copy = art.cloneNode(true);

    copy.removeAttribute(&quot;role&quot;);

    if (copy.tagName.toLowerCase() === &quot;svg&quot;) {

      ids.forEach((old) =&gt; {

      });
      copy.innerHTML = markup;
    }
    slot.appendChild(copy);
  })();

  .don input::-webkit-outer-spin-button,
  .don input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row[data-t=&quot;donation&quot;] { display: none; }  /* removed from the shareable flow */

  /* ============================================================ CATEGORY (flat accordion) */
  .cat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    width: 100%;
    padding: 1.15rem 0.15rem;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font: inherit;
    transition: background var(--dur) ease;
  }
  .cat-head:hover { background: var(--glass); }
  .cat-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* leading glyph: says &quot;group of tickets&quot; before you read a word */
  .cat-lead { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }
  .cat-ico {
    width: 2rem;
    height: 2rem;
    border-radius: 0.6rem;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    color: var(--ink-2);
    background: var(--glass);
    border: 1px solid var(--line-soft);
    transition: color var(--dur) ease, background var(--dur) ease;
  }
  .cat-head[aria-expanded=&quot;true&quot;] .cat-ico { color: var(--glow); }
  .cat-name { display: block; font-weight: 650; font-size: 0.98rem; }
  .cat-meta { display: block; color: var(--ink-2); font-size: 0.8rem; margin-top: 0.15rem; }
  .chev {
    color: var(--ink-3);
    flex-shrink: 0;
    transition: transform var(--dur) var(--ease), color var(--dur) ease;
  }
  .cat-head[aria-expanded=&quot;true&quot;] .chev { transform: rotate(180deg); color: var(--ink-2); }
  .cat-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 280ms var(--ease);
  }
  .cat-body.open { grid-template-rows: 1fr; }
  .cat-body &gt; div { min-height: 0; overflow: hidden; }
  /* The well: recessed surface, darker than the page. Contents read as
     &quot;inside the category&quot; without a card. */
  .cat-well {
    background: var(--well);
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 8px 14px -10px rgba(0, 0, 0, 0.9);
  }
  .cat-body .row {
    margin: 0 0.9rem;
    padding-left: 0.25rem;
    border-bottom-color: var(--line-soft);
  }
  .cat-body .row:last-child { border-bottom: none; }
  .cat-body .row.picked {
    background: linear-gradient(90deg,
      color-mix(in oklab, var(--accent) 11%, transparent),
      transparent 70%);
  }
  @media (prefers-reduced-motion: reduce) {
    .cat-body { transition: none; }
  }

  /* ============================================================ STICKY FOOTER (floats → glass) */
  .foot {
    position: fixed;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    z-index: 50;
    width: min(608px, calc(100vw - 1.6rem));
    padding: 0.75rem 0.75rem 0.75rem 1.3rem;
    border-radius: var(--r-lg);
    background: rgba(16, 16, 18, 0.86);
    border: 1px solid var(--line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 18px 60px -12px color-mix(in oklab, var(--accent) 34%, rgba(0, 0, 0, 0.6));
    transition: transform 320ms var(--ease), opacity 260ms ease, box-shadow 600ms var(--ease);
  }
  .foot.hide {
    transform: translateX(-50%) translateY(150%);
    opacity: 0;
    pointer-events: none;
  }
  .foot-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .foot-sum small {
    display: block;
    color: var(--ink-2);
    font-size: 0.72rem;
    font-weight: 600;
  }
  .foot-sum b {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .cta {
    border: none;
    cursor: pointer;
    font-weight: 800;
    font-size: var(--cta-size);
    padding: 0.8rem 1.7rem;
    border-radius: var(--r-pill);
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    box-shadow: 0 6px 24px -6px color-mix(in oklab, var(--accent) 70%, transparent);
    transition: transform 140ms var(--ease);
    white-space: nowrap;
    min-width: 8.1rem;
  }
  .cta:hover:not(:disabled) { transform: translateY(-1px) scale(1.02); }
  .cta:active:not(:disabled) { transform: scale(0.98); }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .cta:disabled {
    background: var(--glass-2);
    color: var(--ink-3);
    box-shadow: none;
    cursor: not-allowed;
  }

  /* Fee breakdown (production: only when separateCommission) */
  .fees {
    display: none;
    margin-top: 0.7rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--line);
    font-size: 0.83rem;
  }
  .fees.on { display: block; }
  .fee-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    color: var(--ink-2);
    margin-bottom: 0.3rem;
  }
  .fee-row b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .fee-row.tot { color: var(--ink); margin: 0.5rem 0 0; }
  .fee-row.tot b { color: var(--ink); font-weight: 800; font-size: 1rem; }

  /* ============================================================ DEMO CONTROLS */
  .demo-bar {
    display: none;
    position: fixed;
    bottom: 1rem;
    left: 1rem;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.4rem 0.6rem;
    border-radius: var(--r-pill);
    background: rgba(18, 18, 21, 0.9);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    font-size: 0.72rem;
    color: var(--ink-3);
    opacity: 0.45;
    transition: opacity var(--dur) ease;
  }
  .demo-bar:hover, .demo-bar:focus-within { opacity: 1; }
  .demo-bar b { color: var(--ink-2); font-weight: 600; }
  .swatch {
    width: 1.5rem; height: 1.5rem; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; padding: 0;
    transition: transform var(--dur) var(--ease), border-color var(--dur) ease;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .swatch.on { border-color: #fff; }
  .swatch.sunset { background: linear-gradient(135deg, #ff6b4a, #ffc46b); }
  .swatch.acid { background: linear-gradient(135deg, #103d2a, #c6f543); }
  .swatch.midnight { background: linear-gradient(135deg, #2b1f6e, #4da6ff); }
  .fdiv { width: 1px; height: 1.2rem; background: var(--line); margin: 0 0.15rem; }
  .tgl {
    height: 1.5rem; padding: 0 0.6rem; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: transparent; color: var(--ink-3);
    font-size: 0.7rem; font-weight: 600; cursor: pointer;
    transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .tgl:hover { color: var(--ink-2); }
  .tgl.on { color: var(--ink); border-color: #fff; }
  .tgl:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .toast {
    position: fixed;
    bottom: 7.2rem;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    z-index: 70;
    background: var(--ink);
    color: #111;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.55rem 1.05rem;
    border-radius: var(--r-pill);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) ease, transform var(--dur) var(--ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: no-preference) {
    .ev { animation: rise 380ms var(--ease) both; }
    .list { animation: rise 380ms var(--ease) 70ms both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }

      &lt;/div&gt;
      &lt;div class=&quot;r-right&quot;&gt;
        &lt;div class=&quot;r-priceline&quot;&gt;&lt;span class=&quot;r-price&quot;&gt;1,390&lt;small&gt;THB&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;r-ctrl&quot;&gt;
          &lt;div class=&quot;qty&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;minus&quot; aria-label=&quot;Remove one Phase 1 ticket&quot; disabled&gt;−&lt;/button&gt;

        &lt;div class=&quot;r-ctrl&quot;&gt;
          &lt;div class=&quot;qty&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;minus&quot; aria-label=&quot;Remove one VIP experience ticket&quot; disabled&gt;−&lt;/button&gt;
            &lt;span aria-live=&quot;polite&quot;&gt;0&lt;/span&gt;

    &lt;div class=&quot;fee-row&quot;&gt;&lt;span&gt;Fees&lt;/span&gt;&lt;b id=&quot;f-fee&quot;&gt;0 THB&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;fee-row tot&quot;&gt;&lt;span&gt;Total&lt;/span&gt;&lt;b id=&quot;f-tot&quot;&gt;0 THB&lt;/b&gt;&lt;/div&gt;

&lt;script&gt;
  /* ---- Cross-page navigation ------------------------------------------
     The four mockups are separate files. Navigate between them relatively
     when opened locally (all in one folder), or by artifact URL when viewed
     on claude.ai — so the flow connects in both places. */
  const NAV = (() =&gt; {
    const A = {
      event:    &quot;https://claude.ai/code/artifact/77f4ef1f-f3a4-4ee2-b89b-02127d17edc5&quot;,
      select:   &quot;https://claude.ai/code/artifact/47fb6c2a-121e-4972-95a6-8c5a9e8bae19&quot;,
      checkout: &quot;https://claude.ai/code/artifact/c7332fcc-5b94-40ac-9f12-b3026e750ccb&quot;,
      confirm:  &quot;https://claude.ai/code/artifact/44ecbc66-1bd3-4ce2-a6bc-829459ae7cd8&quot;,
    };
    const R = {
      event:    &quot;bumpy-event-page-mockup.html&quot;,
      select:   &quot;bumpy-ticket-selection-mockup.html&quot;,
      checkout: &quot;bumpy-checkout-mockup.html&quot;,
      confirm:  &quot;bumpy-confirmation-mockup.html&quot;,
    };
    const onArtifact = /(^|\.)claude\.ai$/.test(location.hostname);
    return (key, order) =&gt; {
      // inside the combined flow shell: switch views without navigating,
      // handing the chosen tickets to the next page
      try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ bumpyNav: key, order: order || null }, &quot;*&quot;); return; } } catch (e) {}
      window.location.href = (onArtifact ? A : R)[key];
    };
  })();

  // Header: back → event page, close → event page
  document.querySelector('[aria-label=&quot;Go back&quot;]').addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;event&quot;));
  document.querySelector('[aria-label=&quot;Close&quot;]').addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;event&quot;));

  // Category accordion
  // Optional in this build — the accordion only exists when a category is used
  const catBtn = document.getElementById(&quot;cat-btn&quot;);
  const catBody = document.getElementById(&quot;cat-body&quot;);
  if (catBtn &amp;&amp; catBody) {
    catBtn.addEventListener(&quot;click&quot;, () =&gt; {
      const open = catBtn.getAttribute(&quot;aria-expanded&quot;) === &quot;true&quot;;
      catBtn.setAttribute(&quot;aria-expanded&quot;, String(!open));
      catBody.classList.toggle(&quot;open&quot;, !open);
    });
  }

  /* ------------------------------------------------------------------
     Sale-end countdown.
     Production rule (shouldShowSaleEndCountdown): only render when the
     ticket is active AND sale_end_at &lt; event end. Precision adapts —
     seconds only appear in the final hour, where they actually matter.
     ------------------------------------------------------------------ */
  const cdEls = [...document.querySelectorAll(&quot;.r-cd[data-sale-end]&quot;)].map((el) =&gt; {
    const spec = el.dataset.saleEnd;             // demo offsets: &quot;+50h&quot;, &quot;+3h12m&quot;
    const h = /(\d+)h/.exec(spec)?.[1] || 0;
    const m = /(\d+)m/.exec(spec)?.[1] || 0;
    return { el, target: Date.now() + (Number(h) * 3600 + Number(m) * 60) * 1000 };
  });

  function fmtLeft(ms) {
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    const unit = (n, u) =&gt; `${n} ${u}${n !== 1 ? &quot;s&quot; : &quot;&quot;}`;
    if (d &gt; 0) return `${unit(d, &quot;day&quot;)} ${unit(h, &quot;hour&quot;)}`;
    if (h &gt; 0) return `${unit(h, &quot;hour&quot;)} ${m} min`;
    return `${m} min ${sec} sec`;
  }

  function tickCountdowns() {
    cdEls.forEach(({ el, target }) =&gt; {
      const left = target - Date.now();
      el.textContent = left &gt; 0 ? `Sale ends in ${fmtLeft(left)}` : &quot;&quot;;
    });
  }
  tickCountdowns();
  setInterval(tickCountdowns, 1000);

  // Selection state
  const foot = document.getElementById(&quot;foot&quot;);
  const sum = document.getElementById(&quot;sum&quot;);
  const feesEl = document.getElementById(&quot;fees&quot;);
  const state = {};
  /* Fee is a fixed per-ticket amount (fee_per_ticket × qty) carved OUT of the
     ticket price — production's showFeeBreakdown splits the total, never grows
     it: ticketBaseTotal + feeTotal === totalPrice. */
  const FEE_PER_TICKET = 38;

  const fmt = (n) =&gt; n.toLocaleString(&quot;en-US&quot;) + &quot; THB&quot;;

  function render() {
    let count = 0;
    let base = 0;
    document.querySelectorAll(&quot;.row[data-t]&quot;).forEach((row) =&gt; {
      const t = row.dataset.t;
      const n = state[t] || 0;
      const q = row.querySelector(&quot;.qty&quot;);
      if (q) {
        q.querySelector(&quot;span&quot;).textContent = n;
        q.querySelector(&quot;.minus&quot;).disabled = n === 0;
      }
      row.classList.toggle(&quot;picked&quot;, n &gt; 0);
      count += n;
      base += n * Number(row.dataset.price);
    });

    /* Donation validation. Production blocks checkout via hasDonationAmountError
       but only paints the border red — the message below is the addition. */
    const donInput = document.querySelector(&quot;.don input&quot;);
    const donRow = donInput ? donInput.closest(&quot;.row&quot;) : null;
    const donErr = document.getElementById(&quot;don-err&quot;);
    const MIN = 100, MAX = 5000;
    let donation = 0;
    let donInvalid = false;
    let msg = &quot;&quot;;

    // The donation row is optional — this build has no donation ticket.
    if (donInput) {
    const raw = donInput.value.trim();
    donation = raw === &quot;&quot; ? 0 : Number(raw);

    if (raw !== &quot;&quot;) {
      if (!Number.isFinite(donation) || donation &lt; MIN) {
        donInvalid = true;
        msg = `Enter at least ${MIN.toLocaleString()} THB`;
      } else if (donation &gt; MAX) {
        donInvalid = true;
        msg = `Enter ${MAX.toLocaleString()} THB or less`;
      }
    }

    donRow.classList.toggle(&quot;invalid&quot;, donInvalid);
    donInput.setAttribute(&quot;aria-invalid&quot;, String(donInvalid));
    donErr.innerHTML = donInvalid
      ? `&lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;path d=&quot;M12 7.5v5&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;16.3&quot; r=&quot;1&quot; fill=&quot;currentColor&quot;/&gt;&lt;/svg&gt;${msg}`
      : &quot;&quot;;

    // Only a valid donation counts toward the total
    if (!donInvalid &amp;&amp; donation &gt; 0) { count += 1; base += donation; }
    donRow.classList.toggle(&quot;picked&quot;, !donInvalid &amp;&amp; donation &gt; 0);
    }

    const feesOn = feesEl.classList.contains(&quot;on&quot;);
    const total = base;                          // what the tickets cost — fixed
    const fee = feesOn ? FEE_PER_TICKET * count : 0;
    const ticketBase = total - fee;              // carve-out, so base + fee === total

    sum.innerHTML = `&lt;small&gt;${count} ${count === 1 ? &quot;ticket&quot; : &quot;tickets&quot;}&lt;/small&gt;` +
      (feesOn ? &quot;&quot; : `&lt;b&gt;${fmt(total)}&lt;/b&gt;`);
    document.getElementById(&quot;f-base&quot;).textContent = fmt(ticketBase);
    document.getElementById(&quot;f-fee&quot;).textContent = fmt(fee);
    document.getElementById(&quot;f-tot&quot;).textContent = fmt(total);

    // Production parity: an invalid donation blocks checkout
    document.getElementById(&quot;cta&quot;).disabled = donInvalid;
    foot.classList.toggle(&quot;hide&quot;, count === 0 &amp;&amp; !donInvalid);
  }

  document.querySelectorAll(&quot;.row[data-t]&quot;).forEach((row) =&gt; {
    const t = row.dataset.t;
    const plus = row.querySelector(&quot;.plus&quot;);
    const minus = row.querySelector(&quot;.minus&quot;);
    if (plus) plus.addEventListener(&quot;click&quot;, () =&gt; { state[t] = (state[t] || 0) + 1; render(); });
    if (minus) minus.addEventListener(&quot;click&quot;, () =&gt; { state[t] = Math.max(0, (state[t] || 0) - 1); render(); });
  });
  const donEl = document.querySelector(&quot;.don input&quot;);
  if (donEl) donEl.addEventListener(&quot;input&quot;, render);

  // Fee-breakdown variant (production: event.separateCommission)
  const feeTgl = document.getElementById(&quot;fee-tgl&quot;);
  if (feeTgl) {
    feeTgl.addEventListener(&quot;click&quot;, () =&gt; {
      const on = feesEl.classList.toggle(&quot;on&quot;);
      feeTgl.classList.toggle(&quot;on&quot;, on);
      feeTgl.setAttribute(&quot;aria-pressed&quot;, String(on));
      render();
    });
  }

  /* Gather the chosen tickets so Pay + Confirmation show exactly this order.
     One line item per ticket type with a positive quantity, plus a valid
     donation as its own line. */
  function buildOrder() {
    const items = [];
    document.querySelectorAll(&quot;.row[data-t]&quot;).forEach((row) =&gt; {
      const t = row.dataset.t;
      if (t === &quot;donation&quot;) return;
      const qty = state[t] || 0;
      if (qty &gt; 0) {
        items.push({
          name: row.querySelector(&quot;.r-name&quot;).textContent.trim(),
          category: row.dataset.cat || null,
          qty,
          unit: Number(row.dataset.price),
        });
      }
    });
    const donInput = document.querySelector(&quot;.don input&quot;);
    const donation = donInput ? Number((donInput.value || &quot;&quot;).trim()) : NaN;
    if (Number.isFinite(donation) &amp;&amp; donation &gt;= 100 &amp;&amp; donation &lt;= 5000) {
      items.push({ name: &quot;Support the local scene&quot;, category: null, qty: 1, unit: donation });
    }
    return { items };
  }

  document.getElementById(&quot;cta&quot;).addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;checkout&quot;, buildOrder()));

  render();
&lt;/script&gt;

&lt;title&gt;Bumpy — Checkout Redesign Mockup&lt;/title&gt;

&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;style&gt;
  :root {
    /* ---- Surfaces: the depth ladder. well &lt; bg &lt; glass (recessed → floating) */
    --bg: #0a0a0c;
    --well: #050507;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-2: rgba(255, 255, 255, 0.08);
    /* ---- Ink */
    --ink: #f6f5f4;
    --ink-2: #a8a29e;
    --ink-3: #8a8481;
    /* ---- Hairlines */
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.05);
    /* ---- Semantic state. Independent of the artwork accent, on purpose:
           green always means &quot;you saved&quot;, red always means &quot;fix this&quot;. */
    --pos: #34d399;
    --pos-soft: rgba(52, 211, 153, 0.8);
    --warn: #ffc46b;
    --danger: #ff8a8a;
    /* ---- Shape + motion */
    --r-lg: 1.35rem;
    --r-xl: 1.65rem;
    --r-pill: 999px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1); /* ease-out-quint */
    --dur: 220ms;
    /* ---- Label tiers. Two, not six. */
    --label: 0.72rem;     /* section labels: ABOUT, TICKETS, ORDER SUMMARY */
    --label-sm: 0.64rem;  /* micro: WHEN/WHERE, field labels, chips, pills */
    /* ---- The one CTA */
    --cta-size: 0.92rem;

    /* ---- Artwork-extracted accent (per event) */
    --accent: #e7ff1a;
    --glow: #f2ff7d;
    --accent-ink: #1a2300;
    --sky-a: #171033; --sky-b: #6d2b8f; --sky-c: #ff9e5a; --sea: #0c0820; /* blue poster; accent stays orange */
  }
  [data-event-theme=&quot;acid&quot;] {
    --accent: #c6f543; --glow: #59f0c6; --accent-ink: #101a02;
    --sky-a: #05140d; --sky-b: #103d2a; --sky-c: #c6f543; --sea: #061a12;
  }
  [data-event-theme=&quot;midnight&quot;] {
    --accent: #8b7cff; --glow: #4da6ff; --accent-ink: #0d0824;
    --sky-a: #0a0724; --sky-b: #2b1f6e; --sky-c: #4da6ff; --sea: #0a0a2e;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif;
    font-variant-numeric: tabular-nums;  /* one numeric system across the funnel */
    line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* No accent wash — the artwork carries the colour, the page stays neutral. */
  .ambient {
    position: fixed; inset: 0; z-index: -1;
    background: var(--bg);
    mask-image: linear-gradient(to bottom, #000 0%, #000 28%, transparent 66%);
    transition: background 600ms var(--ease);
  }

  /* ============================================================ HEADER */
  .hdr {
    position: sticky; top: 0; z-index: 40;
    background: rgba(10, 10, 12, 0.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .hdr-in {
    /* header chrome matches the other funnel steps (640) so Back/X sit in the
       same spot on every step, even though the body below is wider (940) */
    max-width: 640px; margin: 0 auto;
    padding: 0.7rem clamp(0.8rem, 3vw, 1.5rem);
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  }
  .icon-btn {
    width: 2.3rem; height: 2.3rem; border-radius: 50%; border: none;
    background: transparent; color: var(--ink-2); display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0;
    transition: background var(--dur) ease, color var(--dur) ease;
  }
  .icon-btn:hover { background: var(--glass); color: var(--ink); }
  .icon-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .steps { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .step { display: flex; align-items: center; gap: 0.42rem; min-width: 0; }
  .dot {
    width: 0.42rem; height: 0.42rem; border-radius: 50%;
    background: var(--ink-3); flex-shrink: 0;
    transition: background var(--dur) ease, box-shadow var(--dur) ease;
  }
  .step.now .dot {
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent);
  }
  .step span {
    font-size: var(--label); font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-3); white-space: nowrap;
  }
  .step.now span { color: var(--ink); }
  .step.done span { color: var(--ink-2); }
  .step-sep { width: 1.1rem; height: 1px; background: var(--line); flex-shrink: 0; }
  @media (max-width: 620px) {
    .step:not(.now) span { display: none; }
    .step-sep { width: 0.7rem; }
  }

  .timer { position: relative; height: 2px; background: var(--glass-2); max-width: 640px; margin: 0 auto; }
  .timer-fill {
    height: 100%; background: linear-gradient(90deg, var(--glow), var(--accent));
    transition: width 1s linear, background 400ms ease;
  }
  .timer.warn .timer-fill { background: var(--warn); }
  /* Centred under the step header, and labelled — a bare number in the corner
     doesn't say what is being counted. */
  .timer-txt {
    position: absolute; left: 50%; transform: translateX(-50%); top: 0.55rem;
    white-space: nowrap;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    color: var(--ink-3); font-variant-numeric: tabular-nums;
    transition: color 400ms ease;
  }
  .timer-txt b { font-weight: 700; color: var(--ink-2); }
  .timer.warn .timer-txt, .timer.warn .timer-txt b { color: var(--warn); }

  /* ============================================================ LAYOUT */
  .wrap {
    max-width: 940px; margin: 0 auto;
    padding: 1.6rem clamp(0.9rem, 3vw, 1.5rem) 4rem;
    display: grid; grid-template-columns: 1fr 1.15fr;
    gap: clamp(1.5rem, 4vw, 3rem); align-items: start;
  }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; gap: 2rem; } }
  .col-sticky { position: sticky; top: 5rem; }
  @media (max-width: 860px) { .col-sticky { position: static; } }

  .lbl {
    font-size: var(--label); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--ink-2); margin: 0 0 0.85rem;
  }
  .lbl.mt { margin-top: 2rem; }
  .lbl-sub { font-weight: 500; letter-spacing: 0.04em; color: var(--ink-3); margin-left: 0.4rem; }

  /* Event strip + summary */
  .ev { display: flex; align-items: center; gap: 0.9rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--line); }
  .ev-art {
    width: 3.4rem; height: 3.4rem; border-radius: 0.7rem; overflow: hidden; flex-shrink: 0;
    box-shadow: 0 8px 26px -6px color-mix(in oklab, var(--accent) 45%, transparent);
  }
  .ev-art svg, .ev-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ev-t { font-weight: 700; font-size: 0.98rem; letter-spacing: -0.01em; margin: 0; }
  /* The event's age rule, visible wherever the age is being judged */
  .ev-age {
    display: inline-block; margin-left: 0.35rem; vertical-align: 1px;
    font-size: 0.6rem; font-weight: 800; letter-spacing: 0.04em;
    color: var(--ink-2); padding: 0.1rem 0.35rem;
    border: 1px solid var(--line); border-radius: var(--r-pill);
  }
  .ev-s { color: var(--ink-2); font-size: 0.8rem; margin: 0.1rem 0 0; }

  .ord-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; padding: 0.62rem 0; font-size: 0.9rem;
  }
  .ord-row .n { color: var(--ink-2); min-width: 0; }
  .ord-row .v { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
  .ord-row.item .n { color: var(--ink); }
  .ord-row.item .n b { font-weight: 700; margin-right: 0.3rem; }
  .ord-row.disc .n, .ord-row.disc .v { color: var(--pos); }
  .ord-line-disc {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; padding: 0 0 0.5rem 1.5rem; font-size: 0.78rem; color: var(--pos);
  }
  .ord-line-disc span:first-child { color: var(--pos-soft); }
  .ord-line-disc span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ord-sep { height: 1px; background: var(--line); margin: 0.5rem 0; }
  .ord-row.total { padding-top: 0.2rem; }
  .ord-row.total .n { color: var(--ink); font-weight: 700; font-size: 1rem; }
  .ord-row.total .v { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }

  .coupon { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
  .coupon input {
    flex: 1; min-width: 0; height: 2.4rem; padding: 0 0.9rem;
    border-radius: var(--r-pill); border: 1px solid var(--line);
    background: var(--glass); color: var(--ink); font: inherit; font-size: 0.86rem;
    outline: none; transition: border-color var(--dur) ease;
  }
  .coupon input::placeholder { color: var(--ink-3); }
  .coupon input:focus { border-color: color-mix(in oklab, var(--accent) 60%, transparent); }
  .coupon button {
    height: 2.4rem; padding: 0 1.1rem; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    transition: background var(--dur) ease;
  }
  .coupon button:hover:not(:disabled) { background: var(--glass-2); }
  .coupon button:disabled { opacity: 0.4; cursor: not-allowed; }
  .code-err { margin: 0.55rem 0 0; font-size: 0.78rem; font-weight: 600; color: var(--danger); }
  .code-chip {
    display: inline-flex; align-items: center; gap: 0.5rem;
    margin-top: 0.9rem; padding: 0.4rem 0.45rem 0.4rem 0.75rem;
    border-radius: var(--r-pill);
    background: color-mix(in oklab, var(--pos) 10%, transparent); border: 1px solid color-mix(in oklab, var(--pos) 22%, transparent);
    font-size: 0.8rem; font-weight: 700; color: var(--pos);
  }
  .code-chip button {
    width: 1.3rem; height: 1.3rem; border-radius: 50%; border: none;
    background: transparent; color: var(--pos); cursor: pointer;
    display: grid; place-items: center; transition: background var(--dur) ease;
  }
  .code-chip button:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .signed { display: flex; align-items: center; gap: 0.55rem; margin-top: 1.1rem; font-size: 0.8rem; color: var(--ink-3); }
  .signed b { color: var(--ink-2); font-weight: 600; }
  .signed a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }

  /* ============================================================ VIEW SWITCH */
  .view-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.1rem;
  }
  .view-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .view-sub { color: var(--ink-2); font-size: 0.83rem; margin: 0.2rem 0 0; }
  .view-count {
    font-size: 0.7rem; font-weight: 700; color: var(--ink-2);
    padding: 0.25rem 0.6rem; border: 1px solid var(--line); border-radius: var(--r-pill);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .backlink {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: none; border: none; padding: 0.3rem 0; margin-bottom: 0.7rem;
    color: var(--ink-3); font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    transition: color var(--dur) ease;
  }
  .backlink:hover { color: var(--ink); }
  .backlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sect { margin-top: 1.6rem; }
  .sect:first-of-type { margin-top: 0; }
  .sect-lbl {
    font-size: var(--label); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-2);
    padding-bottom: 0.7rem; margin: 0 0 0.2rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }

  /* Fields */
  .field { margin-top: 0.85rem; }
  .field label {
    display: block; font-size: var(--label-sm); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-2); margin-bottom: 0.3rem;
  }
  .field input, .field select {
    width: 100%; height: 2.6rem; padding: 0 0.85rem;
    border-radius: 0.7rem; border: 1px solid var(--line);
    background: var(--glass); color: var(--ink); font: inherit; font-size: 0.9rem;
    outline: none; transition: border-color var(--dur) ease;
  }
  .field input::placeholder { color: var(--ink-3); }
  .field input:focus, .field select:focus { border-color: color-mix(in oklab, var(--accent) 60%, transparent); }
  .field select { cursor: pointer; padding: 0 0.6rem; }
  .field-row { display: flex; gap: 0.7rem; align-items: flex-start; }
  .field-row .field { flex: 1; min-width: 0; }
  /* Field-level error — under the field that caused it, never colour alone */
  .f-err {
    display: none; align-items: flex-start; gap: 0.3rem;
    margin: 0.4rem 0 0; font-size: 0.74rem; font-weight: 600;
    line-height: 1.35; color: var(--danger);
  }
  .f-err.on { display: flex; }
  .f-err svg { flex-shrink: 0; margin-top: 0.1rem; }
  .field input.bad { border-color: color-mix(in oklab, var(--danger) 80%, transparent); }
  .field input.bad:focus { border-color: var(--danger); }

  /* Profile summary block */
  .att { padding: 1rem 0; }
  .att-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .att-name { font-size: 0.88rem; font-weight: 700; }
  .att-tag {
    font-size: var(--label-sm); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-3); padding: 0.15rem 0.5rem; border: 1px solid var(--line); border-radius: var(--r-pill);
  }
  .att-tag.you { color: var(--glow); border-color: color-mix(in oklab, var(--accent) 35%, transparent); }

  /* Attendee accordion — production behaviour (collapsed panels, first open,
     status icon per panel), restyled: flat headers + recessed wells. */
  .grp-hd {
    font-size: var(--label-sm); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); margin: 1.2rem 0 0; padding-bottom: 0.5rem;
  }
  .att-acc { border-bottom: 1px solid var(--line-soft); }
  .att-acc:last-child { border-bottom: none; }
  .att-hd {
    display: flex; align-items: center; gap: 0.75rem; width: 100%;
    padding: 0.8rem 0.2rem; background: transparent; border: none;
    color: inherit; font: inherit; text-align: left; cursor: pointer;
    border-radius: 0.6rem;
    transition: background var(--dur) ease;
  }
  .att-hd:hover { background: var(--glass); }
  .att-hd:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .att-ico {
    width: 2.1rem; height: 2.1rem; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--glass); color: var(--ink-3);
    transition: background var(--dur) ease, color var(--dur) ease;
  }
  .att-acc.valid .att-ico { background: color-mix(in oklab, var(--pos) 15%, transparent); color: var(--pos); }
  .att-nm { flex: 1; min-width: 0; font-size: 0.9rem; font-weight: 650; }
  .att-nm em {
    font-style: normal; font-weight: 500; color: var(--ink-3);
    margin-left: 0.35rem; font-size: 0.82rem;
  }
  .att-chev { color: var(--ink-3); flex-shrink: 0; transition: transform var(--dur) var(--ease); }
  .att-hd[aria-expanded=&quot;true&quot;] .att-chev { transform: rotate(180deg); }
  .att-body {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 280ms var(--ease);
  }
  .att-body.open { grid-template-rows: 1fr; }
  .att-body &gt; div { min-height: 0; overflow: hidden; }
  .att-well {
    background: var(--well); border-radius: 0.9rem;
    padding: 0.1rem 0.9rem 1rem; margin: 0 0 0.85rem;
    box-shadow: inset 0 8px 14px -10px rgba(0, 0, 0, 0.9);
  }
  @media (prefers-reduced-motion: reduce) { .att-body { transition: none; } }

  .stripe-note, .notice {
    display: flex; gap: 0.6rem; align-items: flex-start;
    margin-top: 1rem; font-size: 0.8rem; color: var(--ink-3);
  }
  .notice { padding-top: 1.1rem; border-top: 1px solid var(--line); font-size: 0.83rem; color: var(--ink-2); }
  .notice svg, .stripe-note svg { flex-shrink: 0; margin-top: 0.15rem; }
  .notice.warn { color: var(--warn); }
  .notice.pos { color: var(--pos); }
  .notice b { color: var(--ink); font-weight: 700; }
  .notice.warn b, .notice.pos b { color: inherit; }

  .cta {
    width: 100%; margin-top: 1.4rem; border: none; cursor: pointer;
    font-weight: 800; font-size: var(--cta-size); padding: 0.95rem 1.5rem;
    border-radius: var(--r-pill); color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    box-shadow: 0 8px 30px -8px color-mix(in oklab, var(--accent) 70%, transparent);
    transition: transform 140ms var(--ease);
  }
  .cta:hover:not(:disabled) { transform: translateY(-1px); }
  .cta:active:not(:disabled) { transform: scale(0.99); }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .cta:disabled { background: var(--glass-2); color: var(--ink-3); box-shadow: none; cursor: not-allowed; }

  .overlay {
    position: fixed; inset: 0; z-index: 80; background: rgba(5,5,7,0.92);
    backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; text-align: center;
  }
  .overlay.on { display: flex; }
  .spin {
    width: 2.4rem; height: 2.4rem; margin: 0 auto 1.1rem; border-radius: 50%;
    border: 2px solid var(--glass-2); border-top-color: var(--accent);
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay p { margin: 0; font-weight: 700; }
  .overlay small { color: var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }

  /* Demo */
  .demo-bar {
    position: fixed; bottom: 1rem; left: 1rem; z-index: 60;
    display: none; align-items: center; gap: 0.4rem; flex-wrap: wrap;
    max-width: calc(100vw - 2rem);
    padding: 0.4rem 0.6rem; border-radius: var(--r-lg);
    background: rgba(18,18,21,0.92); border: 1px solid var(--line);
    backdrop-filter: blur(12px); font-size: 0.7rem; color: var(--ink-3);
    opacity: 0.45; transition: opacity var(--dur) ease;
  }
  .demo-bar:hover, .demo-bar:focus-within { opacity: 1; }
  .demo-bar b { color: var(--ink-2); font-weight: 600; }
  .swatch { width: 1.4rem; height: 1.4rem; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch.on { border-color: #fff; }
  .swatch.sunset { background: linear-gradient(135deg,#ff6b4a,#ffc46b); }
  .swatch.acid { background: linear-gradient(135deg,#103d2a,#c6f543); }
  .swatch.midnight { background: linear-gradient(135deg,#2b1f6e,#4da6ff); }
  .fdiv { width: 1px; height: 1.1rem; background: var(--line); margin: 0 0.1rem; }
  .tgl {
    height: 1.5rem; padding: 0 0.55rem; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: transparent; color: var(--ink-3);
    font-size: 0.68rem; font-weight: 600; cursor: pointer;
    transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .tgl:hover { color: var(--ink-2); }
  .tgl.on { color: var(--ink); border-color: #fff; }
  @media (max-width: 860px) {
  }

  @media (prefers-reduced-motion: no-preference) {
    .view { animation: rise 300ms var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }

            &lt;input id=&quot;cvc&quot; inputmode=&quot;numeric&quot; placeholder=&quot;123&quot; autocomplete=&quot;cc-csc&quot;&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;stripe-note&quot;&gt;
          &lt;svg width=&quot;13&quot; height=&quot;13&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
            &lt;rect x=&quot;4&quot; y=&quot;10.5&quot; width=&quot;16&quot; height=&quot;9.5&quot; rx=&quot;2&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot;/&gt;
            &lt;path d=&quot;M8 10.5V7.8a4 4 0 0 1 8 0v2.7&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot;/&gt;

        &lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;path d=&quot;M5 13l4 4L19 7&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
        &lt;/svg&gt;

        &lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot;/&gt;
          &lt;path d=&quot;M12 7.6V12l2.6 1.6&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;/svg&gt;
        &lt;span id=&quot;approval-txt&quot;&gt;&lt;/span&gt;

    &lt;/div&gt;

&lt;div class=&quot;overlay&quot; id=&quot;overlay&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;

&lt;div class=&quot;overlay&quot; id=&quot;leave&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;leave-t&quot;&gt;
  &lt;div style=&quot;max-width:22rem; padding:0 1.5rem;&quot;&gt;
