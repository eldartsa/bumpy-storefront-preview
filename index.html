&lt;style&gt;
  /* ============================================================
     TOKENS — Bumpy chrome stays monochrome; the EVENT owns the accent.
     data-event-theme switches the artwork-extracted palette.
     ============================================================ */
  :root {
    /* ---- Surfaces: the depth ladder. well &lt; bg &lt; glass (recessed → floating) */
    --bg: #0a0a0c;
    --well: #050507;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-2: rgba(255, 255, 255, 0.08);
    /* ---- Ink */
    --ink: #f6f5f4;
    --ink-2: #a8a29e;
    --ink-3: #8a8481;
    /* ---- Hairlines */
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.05);
    /* ---- Semantic state. Independent of the artwork accent, on purpose:
           green always means &quot;you saved&quot;, red always means &quot;fix this&quot;. */
    --pos: #34d399;
    --pos-soft: rgba(52, 211, 153, 0.8);
    --warn: #ffc46b;
    --danger: #ff8a8a;
    /* ---- Shape + motion */
    --r-lg: 1.35rem;
    --r-xl: 1.65rem;
    --r-pill: 999px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1); /* ease-out-quint */
    --dur: 220ms;
    /* ---- Label tiers. Two, not six. */
    --label: 0.72rem;     /* section labels: ABOUT, TICKETS, ORDER SUMMARY */
    --label-sm: 0.64rem;  /* micro: WHEN/WHERE, field labels, chips, pills */
    /* ---- The one CTA */
    --cta-size: 0.92rem;

    /* Accent stays fixed orange; poster artwork is a separate (non-orange) palette */
    --accent: #e7ff1a;
    --glow: #f2ff7d;
    --accent-ink: #1a2300;
    /* Poster artwork — cool blue hero */
    --sky-a: #0e1f3a;
    --sky-b: #2a63b8;
    --sky-c: #7fd6ec;
    --sea: #0a1526;
  }
  [data-event-theme=&quot;acid&quot;] {
    --accent: #c6f543;
    --glow: #59f0c6;
    --accent-ink: #101a02;
    --sky-a: #05140d;
    --sky-b: #103d2a;
    --sky-c: #c6f543;
    --sea: #061a12;
  }
  [data-event-theme=&quot;midnight&quot;] {
    --accent: #8b7cff;
    --glow: #4da6ff;
    --accent-ink: #0d0824;
    --sky-a: #0a0724;
    --sky-b: #2b1f6e;
    --sky-c: #4da6ff;
    --sea: #0a0a2e;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
  body {
    margin: 0;
    /* containing block for the ambient scrim/floor, so their `bottom: 0`
       resolves against the whole document rather than the viewport
       (production nests the same layers inside a `relative` wrapper) */
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif;
    font-variant-numeric: tabular-nums;  /* one numeric system across the funnel */
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ============================================================
     AMBIENT BACKDROP — the event artwork itself, blurred behind the
     page. Mirrors production's three-layer stack in EventPageClient.tsx:
       1. the hero image, fixed, 100vw x 800px, blur(30px) scale(1.1),
          object-position top
       2. a gradient scrim fading it to black over those 800px
       3. solid page background below
     No accent wash — the artwork supplies the colour.
     ============================================================ */
  .ambient {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 800px;
    z-index: -2;
    overflow: hidden;
    /* production animates opacity 0-&gt;1 and scale 1.15-&gt;1.1 as the image lands */
    animation: ambient-in 1200ms var(--ease) both;
  }
  .ambient &gt; * {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    filter: blur(30px);
    transform: scale(1.1);
  }
  /* Layer 2 — scrolls with the page like production's absolute overlay, so the
     fixed artwork behind it slides out of view rather than following you down. */
  .ambient-scrim {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 800px;
    z-index: -1;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,1) 100%);
    pointer-events: none;
  }
  /* Layer 3 — the fixed artwork never scrolls away on its own, so this panel
     covers it from 800px down (production does the same with a black div).
     Without it the blur would sit behind the whole page, not just the top. */
  .ambient-floor {
    position: absolute;
    top: 800px;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    z-index: -1;
    background: var(--bg);
    pointer-events: none;
  }
  @keyframes ambient-in {
    from { opacity: 0; transform: scale(1.045); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ambient { animation: none; }
  }

  /* ============================================================ HEADER */
  .hdr {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem clamp(1rem, 4vw, 3rem);
    transition: background var(--dur) ease, border-color var(--dur) ease, backdrop-filter var(--dur) ease;
    border-bottom: 1px solid transparent;
  }
  .hdr.scrolled {
    background: rgba(10, 10, 12, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom-color: var(--line);
  }

  .hdr nav { display: flex; gap: 0.4rem; align-items: center; }
  .navlink {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 600;
    transition: opacity var(--dur) ease;
  }
  .navlink:hover { opacity: 0.7; }
  /* bigger header on desktop */
  @media (min-width: 1024px) {
    .hdr { padding-top: 1.2rem; padding-bottom: 1.2rem; }
    .wordmark { font-size: 1.6rem; }
    .navlink { font-size: 1.05rem; }
  }

  /* ============================================================ LAYOUT */
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.5rem) clamp(1rem, 4vw, 3rem) 7rem;
    display: grid;
    grid-template-columns: minmax(300px, 400px) 1fr;
    gap: clamp(1.5rem, 4vw, 3.5rem);
    align-items: start;
  }
  @media (max-width: 880px) {
    .wrap { grid-template-columns: 1fr; }
  }

  /* ============================================================ POSTER */
  .poster-col { position: sticky; top: 5.2rem; }
  @media (max-width: 880px) {
    .poster-col { position: static; max-width: 420px; margin: 0 auto; width: 100%; }
  }
  .poster {
    position: relative;
    border-radius: var(--r-xl);
    overflow: hidden;
    aspect-ratio: 1;
    box-shadow: 0 24px 70px -30px rgba(0, 0, 0, 0.7);
    transition: box-shadow 600ms var(--ease);
  }
  .poster svg, .poster img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .share {
    position: absolute;
    bottom: 0.8rem;
    right: 0.8rem;
    width: 2.4rem;
    height: 2.4rem;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(6px);
    display: grid;
    place-items: center;
    transition: background var(--dur) ease;
  }
  .share:hover { background: rgba(0, 0, 0, 0.75); }
  .going {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    justify-content: center;
    color: var(--ink-2);
    font-size: 0.85rem;
  }
  .faces { display: flex; }
  .face {
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 50%;
    border: 2px solid var(--bg);
    margin-left: -0.5rem;
    background: linear-gradient(135deg, var(--glow), var(--accent));
    display: grid;
    place-items: center;
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--accent-ink);
  }
  .face:first-child { margin-left: 0; }

  /* ============================================================ RIGHT RAIL */
  .title {
    font-family: 'TitleStack', system-ui, sans-serif;
    font-size: clamp(2.9rem, 7vw, 5.4rem);
    font-weight: 400;      /* Anton ships one weight; faux-bold would smear it */
    letter-spacing: 0.004em;
    line-height: 1.02;
    margin: 0 0 1.4rem;
    text-wrap: balance;
    text-shadow: 0 4px 70px color-mix(in oklab, var(--accent) 32%, transparent);
  }

  .card {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .info {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .info &gt; * {
    padding: 1.05rem 1.1rem 1.05rem 0;
    border-left: 1px solid var(--line);
    min-width: 0;
  }
  .info &gt; *:first-child { border-left: none; }
  .info &gt; *:not(:first-child) { padding-left: 1.1rem; }
  @media (max-width: 640px) {
    .info { grid-template-columns: 1fr; }
    .info &gt; * { border-left: none; border-top: 1px solid var(--line); padding-left: 0; }
    .info &gt; *:first-child { border-top: none; }
    .info &gt; *:not(:first-child) { padding-left: 0; }
  }
  .info .k {
    font-size: var(--label-sm);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 0.35rem;
    font-weight: 600;
  }
  .info .v { font-size: 0.92rem; font-weight: 600; margin: 0; }
  .info .s { font-size: 0.78rem; color: var(--ink-2); margin: 0.15rem 0 0; }
  .info button {
    all: unset;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    cursor: pointer;
    padding: 1.05rem 1.1rem;
    border-left: 1px solid var(--line);
    transition: background var(--dur) ease;
  }
  .info button:hover { background: var(--glass); }
  @media (max-width: 640px) {
    .info button { border-left: none; border-top: 1px solid var(--line); padding: 1.05rem 0; }
    /* Stacked full-width rows wasted the whole right half and cost four lines
       each. Put the label/value/sub in one column and pull the action cue into
       that dead space, centred against the block — one line shorter per cell. */
    .info button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        &quot;k cue&quot;
        &quot;v cue&quot;
        &quot;s cue&quot;;
      align-items: center;
      column-gap: 1rem;
    }
    .info button &gt; .k { grid-area: k; }
    .info button &gt; .v,
    .info button &gt; .org-inline { grid-area: v; }
    .info button &gt; .s { grid-area: s; }
    .info button &gt; .where-cue { grid-area: cue; margin-top: 0; justify-self: end; }
  }
  .info button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* The affordance production is missing: say there's a map behind this. */
  .where-cue {
    display: inline-flex; align-items: center; gap: 0.25rem;
    margin-top: 0.45rem;
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-3);
    transition: color var(--dur) ease;
  }
  .info button:hover .where-cue { color: var(--glow); }

  /* ============================================================ MAP SHEET
     Bottom sheet on mobile, centred dialog on desktop — production's shape.
     The map is only built when opened, so it costs nothing on page load. */
  .sheet-scrim {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur) ease;
  }
  .sheet-scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; z-index: 61; left: 0; right: 0; bottom: 0;
    background: #111; border-top: 1px solid var(--line);
    border-radius: 1.75rem 1.75rem 0 0;
    box-shadow: 0 -24px 80px rgba(0, 0, 0, 0.48);
    transform: translateY(100%);
    transition: transform 260ms var(--ease);
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    pointer-events: none;
  }
  .sheet.on { transform: none; pointer-events: auto; }
  @media (min-width: 1024px) {
    .sheet {
      left: 50%; right: auto; top: 50%; bottom: auto;
      width: min(92vw, 640px); border-radius: 1.75rem;
      border: 1px solid var(--line); max-height: 86vh;
      transform: translate(-50%, -50%) scale(0.96); opacity: 0;
      transition: transform 220ms var(--ease), opacity 220ms ease;
    }
    .sheet.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .sheet-grab { display: flex; justify-content: center; padding: 0.75rem 0; }
  .sheet-grab i { width: 2.5rem; height: 4px; border-radius: var(--r-pill); background: rgba(255,255,255,0.2); }
  @media (min-width: 1024px) { .sheet-grab { display: none; } }
  .sheet-map { height: 220px; background: var(--well); position: relative; }
  .sheet-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sheet-body { padding: 1.1rem 1.3rem 1.5rem; }
  .sheet-body h3 { margin: 0 0 0.2rem; font-size: 1.05rem; }
  .sheet-addr { margin: 0; color: var(--ink-2); font-size: 0.88rem; }
  .sheet-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; }
  .sheet-actions button {
    flex: 1; padding: 0.8rem 1rem; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; font-size: 0.85rem; font-weight: 650; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    transition: background var(--dur) ease;
  }
  .sheet-actions button:hover { background: var(--glass); }
  .sheet-actions button.primary {
    border-color: transparent; color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    font-weight: 800;
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-scrim { transition: none; }
  }

  /* ============================================================ TICKET RAIL */
  .price-card {
    padding: 1.4rem 0;

  .price-amount {

  /* &quot;From&quot; when the event has more than one available regular price —

  .price-amount .from {

    letter-spacing: 0;

  .bar .sum b .from {
    font-size: 0.74rem;

  }
  .price-detail { margin: 0.1rem 0 0; color: var(--ink-2); font-size: 0.82rem; }
  /* Mobile: pricing lives in the sticky bar only */
  @media (max-width: 880px) {
    .price-card { display: none; }
    /* The bar is permanently docked at this width, so reserve its height at the

    body { padding-bottom: calc(5.2rem + env(safe-area-inset-bottom, 0px)); }

  .rail { margin-top: 1.1rem; padding: 1.15rem; }

  .countdown {

  }
  .tier {
    display: flex;

    border-radius: 1rem;

    transition: background var(--dur) ease, border-color var(--dur) ease;
  }
  .tier + .tier { margin-top: 0.35rem; }
  .tier:not(.off):hover { background: var(--glass); }
  .tier.picked { background: var(--glass); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
  .tier.off { opacity: 0.55; }
  .tier-info { flex: 1; min-width: 0; }
  .tier-name { font-weight: 700; font-size: 0.98rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .chip {

  .chip.dead { background: var(--glass-2); color: var(--ink-2); }
  .tier-desc { font-size: 0.8rem; color: var(--ink-2); margin-top: 0.15rem; }
  .tier-price { font-weight: 800; font-size: 1.05rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tier-price small { font-weight: 600; font-size: 0.68rem; color: var(--ink-2); margin-left: 0.2rem; }
  .qty { display: flex; align-items: center; gap: 0.55rem; }
  .qty span { min-width: 1.1rem; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .qty button {

  @media (max-width: 640px) {

  /* ============================================================ SECTIONS */

  .lineup { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .artist {
    display: flex;
    align-items: center;
    gap: 0.55rem;

    background: var(--glass);
    border: 1px solid var(--line);
    font-size: 0.88rem;
    font-weight: 600;
  }
  .dj {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    /* fixed row height so a row with a photo and one without match exactly —
       the photo (2.1rem) no longer dictates the height */
    min-height: 3.7rem;

    text-decoration: none;
    transition: background var(--dur) ease;
  }
  .dj + .dj { border-top: 1px solid var(--line); }
  a.dj:hover { background: var(--glass); }
  a.dj:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .dj-name { font-weight: 600; font-size: 0.95rem; flex: 1; min-width: 0; }
  /* Artist photo comes from the Spotify artist object's `images` array.
     That array is EMPTY for most small/local DJs — so there is no initials
     fallback: either a real photo or nothing. Initials next to real faces
     read as broken; absence reads as &quot;no photo&quot;. */
  .dj img {
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--glass);
  }
  /* The avatar column is only reserved when at least ONE artist in this
     line-up has a photo. An all-photoless line-up gets a clean flush-left
     list instead of a column of empty gaps. */
  .djlist.has-photos .dj:not(.has-photo)::before {
    content: &quot;&quot;;
    width: 2.1rem;
    flex-shrink: 0;
  }
  .sp { color: #1db954; display: grid; place-items: center; flex-shrink: 0; }
  .artist i {
    width: 1.7rem;

    background: linear-gradient(135deg, var(--glow), var(--accent));
    display: grid;
    place-items: center;
    font-style: normal;
    font-weight: 800;
    color: var(--accent-ink);
  }
  .org .k { font-size: var(--label-sm); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); margin: 0; font-weight: 600; }
  .org .v { font-weight: 700; margin: 0.1rem 0 0; }
  .org button {
    margin-left: auto;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 0.45rem 1rem;
    border-radius: var(--r-pill);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--dur) ease;
  }
  .org button:hover { background: var(--glass-2); }

  /* ============================================================ STICKY BAR */
  /* status pill on the sticky bar (non-buyable states) */
  .statepill { flex-shrink: 0; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 1rem; border-radius: var(--r-pill); background: var(--glass-2); color: var(--ink-2); }
  .statepill.soon { color: var(--glow); } .statepill.sold { color: var(--danger); } .statepill.paused { color: var(--warn); }
  .statepill[hidden] { display: none; }
  /* DEMO: floating state switcher */
  .demo-states { position: fixed; left: 50%; bottom: 5rem; transform: translateX(-50%); z-index: 60;
    display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 1.4rem);
    padding: 0.35rem; background: rgba(16,16,18,0.92); border: 1px solid var(--line); border-radius: 1.2rem;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 16px 40px -14px rgba(0,0,0,0.7); }
  .demo-states button { border: none; background: transparent; color: var(--ink-3); font: inherit; font-size: 0.74rem; font-weight: 600; padding: 0.4rem 0.7rem; border-radius: 0.85rem; cursor: pointer; white-space: nowrap; transition: background 0.18s, color 0.18s; }
  .demo-states button:hover { color: var(--ink-2); }
  .demo-states button.on { background: var(--glass-2); color: var(--ink); }

  /* Full-bleed dock: flush to both sides and the bottom edge, square corners.
     A soft upward shadow + hairline lifts it off the page so it never blends
     into the artwork backdrop behind it. */
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.05rem clamp(1rem, 4vw, 1.5rem);
    /* keeps it clear of the home indicator without breaking the flush edge */
    padding-bottom: calc(1.05rem + env(safe-area-inset-bottom, 0px));
    border-radius: 0;
    background: rgba(14, 14, 16, 0.92);
    border: none;
    border-top: 1px solid var(--line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 -10px 28px -8px rgba(0, 0, 0, 0.7);
    transition: transform 320ms var(--ease), opacity 320ms ease;
  }
  .bar.hide {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
  }
  .bar .sum { line-height: 1.25; min-width: 0; flex: 1; padding-right: 0.5rem; }
  /* always one line each → the bar keeps a constant height across states */
  .bar .sum b { font-size: 1.02rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .sum small { display: block; margin-top: 0.22rem; color: var(--ink-2); font-size: 0.76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .cta { padding: 0.78rem 1.35rem; font-size: 0.88rem; }
  .cta {
    border: none;
    cursor: pointer;
    font-weight: 800;
    font-size: var(--cta-size);
    letter-spacing: 0.01em;
    padding: 0.8rem 1.2rem;
    border-radius: var(--r-pill);
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    box-shadow: 0 6px 24px -6px color-mix(in oklab, var(--accent) 70%, transparent);
    transition: transform 140ms var(--ease), box-shadow 140ms ease;
    white-space: nowrap;
  }
  .cta:hover { transform: translateY(-1px) scale(1.02); }
  .cta:active { transform: scale(0.98); }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .toast {
    position: fixed;
    bottom: 8.4rem;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    z-index: 70;
    background: var(--ink);
    color: #111;
    font-size: 0.84rem;
    font-weight: 600;
    padding: 0.6rem 1.1rem;
    border-radius: var(--r-pill);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) ease, transform var(--dur) var(--ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================ ENTRANCE
     One orchestrated moment; content is visible without JS
     (animation only ADDS, never gates). */
  @media (prefers-reduced-motion: no-preference) {
    .poster { animation: settle 500ms var(--ease) both; }
    .title { animation: rise 450ms var(--ease) 80ms both; }
    .info, .price-card { animation: rise 450ms var(--ease) 140ms both; }
    @keyframes settle {
      from { opacity: 0; transform: scale(1.03); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }

  footer.site {
    border-top: 1px solid var(--line);
    margin-top: 5rem;
    background: var(--well);
    /* extra bottom clearance so the © row isn't hidden by the sticky BUY NOW bar */
    padding: 3.5rem clamp(1rem, 4vw, 3rem) 6.5rem;
  }
  .foot-in {
    max-width: 1180px; margin: 0 auto;
    display: grid; grid-template-columns: 1.25fr 2fr; gap: clamp(2rem, 5vw, 4rem);
  }
  .foot-brand .wordmark { font-size: 1.5rem; }
  .foot-tag { color: var(--ink-2); font-size: 0.9rem; line-height: 1.55; margin: 1rem 0 1.3rem; max-width: 30ch; }
  .foot-social { display: flex; gap: 0.5rem; }
  .foot-social a {
    width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--line); color: var(--ink-2);
    transition: color var(--dur) ease, background var(--dur) ease, transform var(--dur) ease;
  }
  .foot-social a:hover { color: var(--ink); background: var(--glass-2); transform: translateY(-2px); }
  .foot-social a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .foot-cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem 1rem; }
  .foot-h {
    font-size: var(--label-sm); font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-2); margin: 0 0 0.9rem;
  }
  .foot-col a {
    display: block; color: var(--ink-3); text-decoration: none;
    font-size: 0.86rem; padding: 0.32rem 0; transition: color var(--dur) ease;
  }
  .foot-col a:hover { color: var(--ink); }
  .foot-bottom {
    max-width: 1180px; margin: 3rem auto 0; padding-top: 1.5rem;
    border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.8rem 1.5rem; flex-wrap: wrap; color: var(--ink-3); font-size: 0.78rem;
  }
  .foot-legal { display: flex; gap: 1.3rem; flex-wrap: wrap; }
  .foot-legal a { color: var(--ink-3); text-decoration: none; }
  .foot-legal a:hover { color: var(--ink-2); }
  @media (max-width: 760px) {
    .foot-in { grid-template-columns: 1fr; gap: 2.2rem; }
    .foot-cols { grid-template-columns: repeat(2, 1fr); }
  }

&lt;script&gt;
  /* ---- Cross-page navigation ------------------------------------------
     The four mockups are separate files. Navigate between them relatively
     when opened locally (all in one folder), or by artifact URL when viewed
     on claude.ai — so the flow connects in both places. */
  const NAV = (() =&gt; {
    const A = {
      event:    &quot;https://claude.ai/code/artifact/77f4ef1f-f3a4-4ee2-b89b-02127d17edc5&quot;,
      select:   &quot;https://claude.ai/code/artifact/47fb6c2a-121e-4972-95a6-8c5a9e8bae19&quot;,
      checkout: &quot;https://claude.ai/code/artifact/c7332fcc-5b94-40ac-9f12-b3026e750ccb&quot;,
      confirm:  &quot;https://claude.ai/code/artifact/44ecbc66-1bd3-4ce2-a6bc-829459ae7cd8&quot;,
      login:    &quot;https://claude.ai/code/artifact/b0fd7a83-c8c8-43dd-84d9-41c1dc2a02f8&quot;,
      producer: &quot;https://claude.ai/code/artifact/bad2b8f4-e81e-4ce5-9c86-d950e9b49a6b&quot;,
    };
    const R = {
      event:    &quot;bumpy-event-page-mockup.html&quot;,
      select:   &quot;bumpy-ticket-selection-mockup.html&quot;,
      checkout: &quot;bumpy-checkout-mockup.html&quot;,
      confirm:  &quot;bumpy-confirmation-mockup.html&quot;,
      login:    &quot;bumpy-login-mockup.html&quot;,
      producer: &quot;bumpy-producer.html&quot;,
      partner:  &quot;bumpy-partner-mockup.html&quot;,
      contact:  &quot;bumpy-contact-mockup.html&quot;,
      about:    &quot;bumpy-about-mockup.html&quot;,
      home:     &quot;bumpy-home-mockup.html&quot;,
    };
    const onArtifact = /(^|\.)claude\.ai$/.test(location.hostname);
    return (key) =&gt; {
      // inside the combined flow shell: switch views without navigating
      try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ bumpyNav: key }, &quot;*&quot;); return; } } catch (e) {}
      window.location.href = (onArtifact ? A : R)[key] || R[key];
    };
  })();


  // shared toast (element looked up lazily so order of script blocks can't bite)
  function say(msg) {
    const t = document.getElementById(&quot;toast&quot;);
    t.textContent = msg;
    t.classList.add(&quot;show&quot;);
    clearTimeout(t._t);
    t._t = setTimeout(() =&gt; t.classList.remove(&quot;show&quot;), 2400);
  }

  /* ---- Map sheet -------------------------------------------------------
     The whole argument for keeping the modal: the map is built on OPEN, so a
     visitor who never asks &quot;where is this?&quot; never pays for the embed. In
     production this innerHTML is the Google Maps &lt;iframe&gt;. */
  const sheet = document.getElementById(&quot;sheet&quot;);
  const scrim = document.getElementById(&quot;scrim&quot;);
  const sheetMap = document.getElementById(&quot;sheet-map&quot;);
  let mapBuilt = false;
  let lastFocus = null;

  function buildMap() {
    if (mapBuilt) return;
    sheetMap.innerHTML = `
      &lt;svg viewBox=&quot;0 0 400 220&quot; preserveAspectRatio=&quot;xMidYMid slice&quot; aria-label=&quot;Map showing The Wave Sunset&quot;&gt;
        &lt;rect width=&quot;400&quot; height=&quot;220&quot; style=&quot;fill:var(--sea)&quot;/&gt;
        &lt;path d=&quot;M0 140 Q 90 105 180 130 T 400 118 L400 220 L0 220 Z&quot; style=&quot;fill:var(--sky-a)&quot;/&gt;
        &lt;path d=&quot;M0 92 Q 70 132 160 112 T 400 142&quot; fill=&quot;none&quot; stroke=&quot;rgba(255,255,255,.22)&quot;
              stroke-width=&quot;3&quot; stroke-dasharray=&quot;1 8&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;circle cx=&quot;188&quot; cy=&quot;120&quot; r=&quot;26&quot; style=&quot;fill:var(--accent)&quot; opacity=&quot;.2&quot;/&gt;
        &lt;circle cx=&quot;188&quot; cy=&quot;120&quot; r=&quot;7&quot; style=&quot;fill:var(--accent)&quot;/&gt;
      &lt;/svg&gt;`;
    mapBuilt = true;
  }

  function openSheet() {
    lastFocus = document.activeElement;
    buildMap();                    // ← only now does the map exist
    sheet.hidden = false;
    /* Force a reflow so the transition has a start value, then flip the class
       synchronously. Do NOT gate this on requestAnimationFrame: rAF doesn't
       fire when the renderer isn't painting (background tab, headless), which
       would leave the sheet open-but-invisible with scroll locked and focus
       trapped. Same failure mode as production's JS-gated hero. */
    void sheet.offsetHeight;
    scrim.classList.add(&quot;on&quot;);
    sheet.classList.add(&quot;on&quot;);
    document.body.style.overflow = &quot;hidden&quot;;
    sheet.querySelector(&quot;#sheet-maps&quot;).focus();
  }
  function closeSheet() {
    scrim.classList.remove(&quot;on&quot;);
    sheet.classList.remove(&quot;on&quot;);
    document.body.style.overflow = &quot;&quot;;
    setTimeout(() =&gt; { sheet.hidden = true; }, 260);
    lastFocus?.focus();
  }
  document.getElementById(&quot;where-btn&quot;).addEventListener(&quot;click&quot;, openSheet);
  scrim.addEventListener(&quot;click&quot;, closeSheet);
  document.addEventListener(&quot;keydown&quot;, (e) =&gt; {
    if (e.key === &quot;Escape&quot; &amp;&amp; !sheet.hidden) closeSheet();
  });
  document.getElementById(&quot;sheet-copy&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    say(&quot;Address copied&quot;);
  });
  document.getElementById(&quot;sheet-maps&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    say(&quot;→ Opens your maps app&quot;);
  });

  // Header backdrop on scroll (the fix for the transparent-header collision)
  const hdr = document.getElementById(&quot;hdr&quot;);
  addEventListener(&quot;scroll&quot;, () =&gt; hdr.classList.toggle(&quot;scrolled&quot;, scrollY &gt; 24), { passive: true });

  // Demo theme switcher — stands in for server-side artwork palette extraction


  // BUY NOW → in production this opens the ticket selection page (separate step, unchanged)
  const bar = document.getElementById(&quot;bar&quot;);
  function announce() { NAV(&quot;select&quot;); }
  document.getElementById(&quot;buynow&quot;).addEventListener(&quot;click&quot;, announce);
  document.getElementById(&quot;barcta&quot;).addEventListener(&quot;click&quot;, announce);

  /* ---- DEMO: preview each event state (production copy, per mobileStickyContent) ---- */
  const EVENT_STATES = {
    /* `from: true` mirrors production's hasMultipleRegularPrices — this event has
       four available regular prices (900 / 1,390 / 1,600 / 2,800), so the card
       shows the lowest with a &quot;From&quot; prefix. Sold-out and not-yet-on-sale tiers
       (Early bird 990, Late entry 300) are excluded, as is the donation row. */
    on_sale:    { t: &quot;900 THB&quot;, from: true, d: &quot;Secure your spot today.&quot;,              buy: true },
    countdown:  { t: &quot;Sale starts soon&quot;,    d: &quot;2 days 4 hours&quot;,                       pill: &quot;Soon&quot;,      cls: &quot;soon&quot; },
    sold_out:   { t: &quot;Sold out&quot;,            d: &quot;No tickets are currently available.&quot;,  pill: &quot;Sold out&quot;,  cls: &quot;sold&quot; },
    sale_ended: { t: &quot;Sales closed&quot;,        d: &quot;Tickets are no longer available.&quot;,     pill: &quot;Closed&quot; },
    paused:     { t: &quot;Sale paused&quot;, d: &quot;Tickets are currently unavailable.&quot;,   pill: &quot;Paused&quot;,    cls: &quot;paused&quot; },
    ended:      { t: &quot;Event ended&quot;,         d: &quot;This event has already taken place.&quot;,  pill: &quot;Ended&quot; },
    cancelled:  { t: &quot;Event cancelled&quot;,     d: &quot;This event won't take place.&quot;,         pill: &quot;Cancelled&quot; },
  };
  function setEventState(key) {
    const s = EVENT_STATES[key]; if (!s) return;
    // Rebuilt rather than assigned as text, so the &quot;From&quot; prefix keeps its own
    // element (and states without a prefix drop it cleanly).
    const title = (el) =&gt; {
      el.textContent = &quot;&quot;;
      if (s.from) {
        const f = document.createElement(&quot;span&quot;);
        f.className = &quot;from&quot;;
        f.textContent = &quot;From&quot;;
        el.appendChild(f);
      }
      el.appendChild(document.createTextNode((s.from ? &quot; &quot; : &quot;&quot;) + s.t));
    };
    title(document.getElementById(&quot;pc-title&quot;));
    document.getElementById(&quot;pc-detail&quot;).textContent = s.d;
    document.getElementById(&quot;buynow&quot;).hidden = !s.buy;      // desktop card: title + detail only when unavailable
    title(document.getElementById(&quot;bar-title&quot;));
    document.getElementById(&quot;bar-detail&quot;).textContent = s.d;
    document.getElementById(&quot;barcta&quot;).hidden = !s.buy;
    const pill = document.getElementById(&quot;bar-pill&quot;);        // status pill lives on the mobile sticky bar
    if (s.buy) { pill.hidden = true; }
    else { pill.hidden = false; pill.textContent = s.pill; pill.className = &quot;statepill&quot; + (s.cls ? &quot; &quot; + s.cls : &quot;&quot;); }
    document.querySelectorAll(&quot;.demo-states button&quot;).forEach(b =&gt; b.classList.toggle(&quot;on&quot;, b.dataset.state === key));
  }
  document.querySelectorAll(&quot;.demo-states button&quot;).forEach(b =&gt;
    b.addEventListener(&quot;click&quot;, () =&gt; setEventState(b.dataset.state)));
  document.getElementById(&quot;loginlink&quot;).addEventListener(&quot;click&quot;, (e) =&gt; { e.preventDefault(); NAV(&quot;login&quot;); });
  // clicking the organizer opens their producer page
  const orgEl = document.getElementById(&quot;org&quot;);
  if (orgEl) orgEl.addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;producer&quot;));  // native button handles Enter/Space

  // footer links that route to other pages (Contact us / About us / Become Partner)

    @keyframes rise {

&lt;script&gt;
  /* ---- Cross-page navigation ------------------------------------------
     The four mockups are separate files. Navigate between them relatively
     when opened locally (all in one folder), or by artifact URL when viewed
     on claude.ai — so the flow connects in both places. */
  const NAV = (() =&gt; {
    const A = {
      event:    &quot;https://claude.ai/code/artifact/77f4ef1f-f3a4-4ee2-b89b-02127d17edc5&quot;,
      select:   &quot;https://claude.ai/code/artifact/47fb6c2a-121e-4972-95a6-8c5a9e8bae19&quot;,
      checkout: &quot;https://claude.ai/code/artifact/c7332fcc-5b94-40ac-9f12-b3026e750ccb&quot;,
      confirm:  &quot;https://claude.ai/code/artifact/44ecbc66-1bd3-4ce2-a6bc-829459ae7cd8&quot;,
    };
    const R = {
      event:    &quot;bumpy-event-page-mockup.html&quot;,
      select:   &quot;bumpy-ticket-selection-mockup.html&quot;,
      checkout: &quot;bumpy-checkout-mockup.html&quot;,
      confirm:  &quot;bumpy-confirmation-mockup.html&quot;,
    };
    const onArtifact = /(^|\.)claude\.ai$/.test(location.hostname);
    return (key, order) =&gt; {
      // inside the combined flow shell: switch views without navigating,
      // handing the chosen tickets to the next page
      try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ bumpyNav: key, order: order || null }, &quot;*&quot;); return; } } catch (e) {}
      window.location.href = (onArtifact ? A : R)[key];
    };
  })();

  // Header: back → event page, close → event page
  document.querySelector('[aria-label=&quot;Go back&quot;]').addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;event&quot;));
  document.querySelector('[aria-label=&quot;Close&quot;]').addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;event&quot;));

  // Category accordion
  const catBtn = document.getElementById(&quot;cat-btn&quot;);
  const catBody = document.getElementById(&quot;cat-body&quot;);
  catBtn.addEventListener(&quot;click&quot;, () =&gt; {
    const open = catBtn.getAttribute(&quot;aria-expanded&quot;) === &quot;true&quot;;
    catBtn.setAttribute(&quot;aria-expanded&quot;, String(!open));
    catBody.classList.toggle(&quot;open&quot;, !open);
  });

  /* ------------------------------------------------------------------
     Sale-end countdown.
     Production rule (shouldShowSaleEndCountdown): only render when the
     ticket is active AND sale_end_at &lt; event end. Precision adapts —
     seconds only appear in the final hour, where they actually matter.
     ------------------------------------------------------------------ */
  const cdEls = [...document.querySelectorAll(&quot;.r-cd[data-sale-end]&quot;)].map((el) =&gt; {
    const spec = el.dataset.saleEnd;             // demo offsets: &quot;+50h&quot;, &quot;+3h12m&quot;
    const h = /(\d+)h/.exec(spec)?.[1] || 0;
    const m = /(\d+)m/.exec(spec)?.[1] || 0;
    return { el, target: Date.now() + (Number(h) * 3600 + Number(m) * 60) * 1000 };
  });

  function fmtLeft(ms) {
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    const unit = (n, u) =&gt; `${n} ${u}${n !== 1 ? &quot;s&quot; : &quot;&quot;}`;
    if (d &gt; 0) return `${unit(d, &quot;day&quot;)} ${unit(h, &quot;hour&quot;)}`;
    if (h &gt; 0) return `${unit(h, &quot;hour&quot;)} ${m} min`;
    return `${m} min ${sec} sec`;
  }

  function tickCountdowns() {
    cdEls.forEach(({ el, target }) =&gt; {
      const left = target - Date.now();
      el.textContent = left &gt; 0 ? `Sale ends in ${fmtLeft(left)}` : &quot;&quot;;
    });
  }
  tickCountdowns();
  setInterval(tickCountdowns, 1000);

  // Selection state
  const foot = document.getElementById(&quot;foot&quot;);
  const sum = document.getElementById(&quot;sum&quot;);
  const feesEl = document.getElementById(&quot;fees&quot;);
  const state = {};
  /* Fee is a fixed per-ticket amount (fee_per_ticket × qty) carved OUT of the
     ticket price — production's showFeeBreakdown splits the total, never grows
     it: ticketBaseTotal + feeTotal === totalPrice. */
  const FEE_PER_TICKET = 38;

  const fmt = (n) =&gt; n.toLocaleString(&quot;en-US&quot;) + &quot; THB&quot;;

  function render() {
    let count = 0;
    let base = 0;
    document.querySelectorAll(&quot;.row[data-t]&quot;).forEach((row) =&gt; {
      const t = row.dataset.t;
      const n = state[t] || 0;
      const q = row.querySelector(&quot;.qty&quot;);
      if (q) {
        q.querySelector(&quot;span&quot;).textContent = n;
        q.querySelector(&quot;.minus&quot;).disabled = n === 0;
      }
      row.classList.toggle(&quot;picked&quot;, n &gt; 0);
      count += n;
      base += n * Number(row.dataset.price);
    });

    document.getElementById(&quot;cta&quot;).disabled = donInvalid;

      const qty = state[t] || 0;
      if (qty &gt; 0) {

          name: row.querySelector(&quot;.r-name&quot;).textContent.trim(),
          category: row.dataset.cat || null,

    border-radius: var(--r-pill); color: var(--accent-ink);
    background: linear-gradient(135deg, var(--glow), var(--accent));
    box-shadow: 0 8px 30px -8px color-mix(in oklab, var(--accent) 70%, transparent);
    transition: transform 140ms var(--ease);
  }
  .cta:hover:not(:disabled) { transform: translateY(-1px); }
  .cta:active:not(:disabled) { transform: scale(0.99); }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .cta:disabled { background: var(--glass-2); color: var(--ink-3); box-shadow: none; cursor: not-allowed; }

  .overlay {
    position: fixed; inset: 0; z-index: 80; background: rgba(5,5,7,0.92);
    backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; text-align: center;
  }
  .overlay.on { display: flex; }
  .spin {
    width: 2.4rem; height: 2.4rem; margin: 0 auto 1.1rem; border-radius: 50%;
    border: 2px solid var(--glass-2); border-top-color: var(--accent);
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay p { margin: 0; font-weight: 700; }
  .overlay small { color: var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }

  /* Demo */
  .demo-bar {
    position: fixed; bottom: 1rem; left: 1rem; z-index: 60;
    display: none; align-items: center; gap: 0.4rem; flex-wrap: wrap;
    max-width: calc(100vw - 2rem);
    padding: 0.4rem 0.6rem; border-radius: var(--r-lg);
    background: rgba(18,18,21,0.92); border: 1px solid var(--line);
    backdrop-filter: blur(12px); font-size: 0.7rem; color: var(--ink-3);
    opacity: 0.45; transition: opacity var(--dur) ease;
  }
  .demo-bar:hover, .demo-bar:focus-within { opacity: 1; }
  .demo-bar b { color: var(--ink-2); font-weight: 600; }
  .swatch { width: 1.4rem; height: 1.4rem; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch.on { border-color: #fff; }
  .swatch.sunset { background: linear-gradient(135deg,#ff6b4a,#ffc46b); }
  .swatch.acid { background: linear-gradient(135deg,#103d2a,#c6f543); }
  .swatch.midnight { background: linear-gradient(135deg,#2b1f6e,#4da6ff); }
  .fdiv { width: 1px; height: 1.1rem; background: var(--line); margin: 0 0.1rem; }
  .tgl {
    height: 1.5rem; padding: 0 0.55rem; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: transparent; color: var(--ink-3);
    font-size: 0.68rem; font-weight: 600; cursor: pointer;
    transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .tgl:hover { color: var(--ink-2); }
  .tgl.on { color: var(--ink); border-color: #fff; }
  @media (max-width: 860px) {
    .demo-bar { bottom: auto; top: 4.1rem; left: 50%; transform: translateX(-50%); }
    .demo-bar b { display: none; }
    .wrap { padding-top: 5rem; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .view { animation: rise 300ms var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }

  &lt;button class=&quot;tgl on&quot; id=&quot;t-profile&quot; aria-pressed=&quot;true&quot;&gt;Profile done&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-under18&quot; aria-pressed=&quot;false&quot;&gt;Buyer under 18&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-fees&quot; aria-pressed=&quot;false&quot;&gt;Fees&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-free&quot; aria-pressed=&quot;false&quot;&gt;Free&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-approval&quot; aria-pressed=&quot;false&quot;&gt;Approval&lt;/button&gt;
&lt;/div&gt;

&lt;script&gt;
  /* ---- Cross-page navigation ------------------------------------------
     The four mockups are separate files. Navigate between them relatively
     when opened locally (all in one folder), or by artifact URL when viewed
     on claude.ai — so the flow connects in both places. */
  const NAV = (() =&gt; {
    const A = {
      event:    &quot;https://claude.ai/code/artifact/77f4ef1f-f3a4-4ee2-b89b-02127d17edc5&quot;,
      select:   &quot;https://claude.ai/code/artifact/47fb6c2a-121e-4972-95a6-8c5a9e8bae19&quot;,
      checkout: &quot;https://claude.ai/code/artifact/c7332fcc-5b94-40ac-9f12-b3026e750ccb&quot;,
      confirm:  &quot;https://claude.ai/code/artifact/44ecbc66-1bd3-4ce2-a6bc-829459ae7cd8&quot;,
    };
    const R = {
      event:    &quot;bumpy-event-page-mockup.html&quot;,
      select:   &quot;bumpy-ticket-selection-mockup.html&quot;,
      checkout: &quot;bumpy-checkout-mockup.html&quot;,
      confirm:  &quot;bumpy-confirmation-mockup.html&quot;,
    };
    const onArtifact = /(^|\.)claude\.ai$/.test(location.hostname);
    return (key) =&gt; {
      // inside the combined flow shell: switch views without navigating
      try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ bumpyNav: key }, &quot;*&quot;); return; } } catch (e) {}
      window.location.href = (onArtifact ? A : R)[key];
    };
  })();

  const $ = (id) =&gt; document.getElementById(id);

  /* ---- Order carried from the Choose Ticket step ----------------------
     Each line: { name, category, qty, unit }. When this page is opened on
     its own (no order handed over), fall back to a representative order so
     it still reads as a complete page. */
  const DEFAULT_ORDER = { items: [
    { name: &quot;General admission&quot;, category: null, qty: 2, unit: 1390 },
    { name: &quot;Mezzanine entry&quot;, category: &quot;VIP Mezzanine&quot;, qty: 1, unit: 900 },
  ] };
  let ORDER = DEFAULT_ORDER;
  const orderCount = () =&gt; ORDER.items.reduce((s, i) =&gt; s + i.qty, 0);
  const orderSub = () =&gt; ORDER.items.reduce((s, i) =&gt; s + i.qty * i.unit, 0);

  window.addEventListener(&quot;message&quot;, (e) =&gt; {
    const o = e.data &amp;&amp; e.data.bumpyOrder;
    if (o &amp;&amp; Array.isArray(o.items) &amp;&amp; o.items.length) {
      ORDER = o;
      buildAttendees();   // attendee slots follow the chosen tickets
      render();
    }
  });

  /* ==================================================================
     Production logic (CheckoutPageClient.tsx):
       isIndividualMode         = event.dealType === &quot;individual&quot;
       requiresGroupAgeCorrection = !individual &amp;&amp; hasAgeRestriction
                                    &amp;&amp; profileComplete &amp;&amp; buyerAge &lt; ageLimit
       requiresAttendeeDetails  = isIndividualMode || requiresGroupAgeCorrection
       getInitialPaySubStep()   = !profileComplete ? &quot;profile&quot;
                                : requiresAttendeeDetails ? &quot;attendees&quot;
                                : &quot;payment&quot;
     Group + no age issue therefore has NO attendee step at all.
     ================================================================== */
  /* `profile` holds what the buyer actually submitted this session — production's
     `profileData`, which also short-circuits isProfileComplete to true. */
  const state = { mode: &quot;group&quot;, profileDone: true, under18: false, view: &quot;payment&quot;, profile: null };

  const isIndividual = () =&gt; state.mode === &quot;individual&quot;;

  /* The saved profile wins; otherwise fall back to the demo's stored customer. */
  function buyerProfile() {
    return state.profile || {
      first: &quot;Eldar&quot;, last: &quot;Tsabari&quot;, email: &quot;eldar@example.com&quot;,
      dob: state.under18 ? DOB_UNDER : DOB_OK, gender: &quot;male&quot;,
    };
  }
  const buyerDob = () =&gt; buyerProfile().dob;

  /* Group + age-restricted event + the BUYER is under the limit → collect the
     main attendee so the age can be corrected. Judged from the buyer's real
     birth date, so a date just typed into the profile form drives the routing
     (production: getRequiresAttendeeDetailsForProfile(submittedProfile)). */
  function requiresGroupAgeCorrection() {
    if (isIndividual()) return false;
    const a = ageAt(buyerDob(), EVENT_START);
    return a !== null &amp;&amp; a &lt; AGE_LIMIT;
  }
  const requiresAttendeeDetails = () =&gt; isIndividual() || requiresGroupAgeCorrection();

  /* Routing — mirrors getInitialPaySubStep() + the advance effect:
       !profileComplete            → profile
       requiresAttendeeDetails     → attendees
       otherwise                   → payment
     Individual ALWAYS gets attendees; group only when the buyer is under-age. */
  const stepAfterProfile = () =&gt; (requiresAttendeeDetails() ? &quot;attendees&quot; : &quot;payment&quot;);
  const initialView = () =&gt;
    !state.profileDone ? &quot;profile&quot; : stepAfterProfile();

  /* Attendee groups — built from cart items in production (one slot per ticket).
     individual → every ticket needs an attendee (AttendeesList mode=&quot;all&quot;)
     under-age  → a single synthetic &quot;Main attendee&quot; group, quantity 1,
                  prefilled from the profile (mode=&quot;primary&quot;) */
  const EVENT_START = &quot;2026-07-15&quot;;   // age is measured at the event date
  const AGE_LIMIT = 18;               // event.age_limit — the event is 18+
  /* The &quot;Buyer under 18&quot; toggle must change the buyer's actual birth date,
     not just the routing — that date is what prefills the main attendee and
     what the age check judges. 2012 → 14 at the event; 1997 → 29. */
  const DOB_UNDER = &quot;2012-01-01&quot;;
  const DOB_OK = &quot;1997-04-12&quot;;

  /* A ticket that belongs to a category reads &quot;Category/Ticket&quot;. On the
     selection page the category is an accordion, so the nesting is visual;
     in checkout that hierarchy is gone, so the category has to travel inline
     with the name or &quot;Deck entry&quot; loses its context. */
  const ticketLabel = (t) =&gt; (t.category ? `${t.category}/${t.ticketName}` : t.ticketName);

  function attendeeGroups() {
    /* Individual: one attendee per ticket, grouped by ticket type (mode &quot;all&quot;).
       Group: a single &quot;Main attendee&quot; prefilled from the profile (mode &quot;primary&quot;)
       — required only for age correction, but always REACHABLE so a repeat buyer
       can review or fix their details at purchase time. */
    if (isIndividual()) {
      // one attendee slot per ticket, grouped by type; the very first slot
      // overall is prefilled from the buyer's profile
      let prefilled = false;
      return ORDER.items.map((i) =&gt; ({
        ticketName: i.name, category: i.category, quantity: i.qty,
        rows: Array.from({ length: i.qty }, () =&gt; {
          if (!prefilled) { prefilled = true; return { prefill: true }; }
          return {};
        }),
      }));
    }
    return [{ ticketName: &quot;Main attendee&quot;, category: null, quantity: 1, rows: [{ prefill: true }] }];
  }

  function ageAt(dob, target) {
    if (!dob) return null;
    const t = new Date(target), b = new Date(dob + &quot;T00:00:00&quot;);
    if (isNaN(t) || isNaN(b)) return null;
    let a = t.getFullYear() - b.getFullYear();
    const m = t.getMonth() - b.getMonth();
    if (m &lt; 0 || (m === 0 &amp;&amp; t.getDate() &lt; b.getDate())) a--;
    return a;
  }

  /* Production isAttendeeDataValid: all five fields, plus age &gt;= ageLimit at
     the event date when the event has an age restriction. */
  function panelValid(panel) {
    const vals = [...panel.querySelectorAll(&quot;.a-in&quot;)];
    if (!vals.every((e) =&gt; e.value.trim() !== &quot;&quot;)) return false;
    const dob = panel.querySelector('input[type=&quot;date&quot;]').value;
    const a = ageAt(dob, EVENT_START);
    return a !== null &amp;&amp; a &gt;= AGE_LIMIT;
  }

  const ICON_CHECK = '&lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 13l4 4L19 7&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;';
  const ICON_PERSON = '&lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;8&quot; r=&quot;3.4&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;path d=&quot;M5.5 19.5a6.5 6.5 0 0 1 13 0&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/svg&gt;';

  function buildAttendees() {
    const wrap = $(&quot;att-list&quot;);
    wrap.innerHTML = &quot;&quot;;
    const groups = attendeeGroups();
    const p = buyerProfile();   // attendee 1 mirrors the buyer's saved profile
    const GENDERS = [[&quot;male&quot;, &quot;Male&quot;], [&quot;female&quot;, &quot;Female&quot;], [&quot;other&quot;, &quot;Other&quot;]];
    let n = 0;

    groups.forEach((g) =&gt; {
      // production: ticket-type header only when there's more than one group
      if (groups.length &gt; 1) {
        const h = document.createElement(&quot;p&quot;);
        h.className = &quot;grp-hd&quot;;
        h.textContent = `${ticketLabel(g)} (${g.quantity} ${g.quantity === 1 ? &quot;ticket&quot; : &quot;tickets&quot;})`;
        wrap.appendChild(h);
      }
      g.rows.forEach((row) =&gt; {
        const idx = n++;
        const id = &quot;at&quot; + idx;
        const el = document.createElement(&quot;div&quot;);
        el.className = &quot;att-acc&quot;;
        el.dataset.idx = idx;
        // built collapsed; autoExpand() below opens the first one that needs work
        const open = false;
        el.innerHTML = `
          &lt;button type=&quot;button&quot; class=&quot;att-hd&quot; aria-expanded=&quot;${open}&quot; aria-controls=&quot;${id}b&quot;&gt;
            &lt;span class=&quot;att-ico&quot; aria-hidden=&quot;true&quot;&gt;${ICON_PERSON}&lt;/span&gt;
            &lt;span class=&quot;att-nm&quot;&gt;&lt;/span&gt;
            &lt;svg class=&quot;att-chev&quot; width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
              &lt;path d=&quot;M6 9l6 6 6-6&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
            &lt;/svg&gt;
          &lt;/button&gt;
          &lt;div class=&quot;att-body ${open ? &quot;open&quot; : &quot;&quot;}&quot; id=&quot;${id}b&quot;&gt;
            &lt;div&gt;&lt;div class=&quot;att-well&quot;&gt;
              &lt;div class=&quot;field-row&quot;&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}f&quot;&gt;First name&lt;/label&gt;
                  &lt;input id=&quot;${id}f&quot; class=&quot;a-in&quot; value=&quot;${row.prefill ? p.first : &quot;&quot;}&quot; placeholder=&quot;First name&quot;&gt;
                &lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}l&quot;&gt;Last name&lt;/label&gt;
                  &lt;input id=&quot;${id}l&quot; class=&quot;a-in&quot; value=&quot;${row.prefill ? p.last : &quot;&quot;}&quot; placeholder=&quot;Last name&quot;&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;field&quot;&gt;
                &lt;label for=&quot;${id}e&quot;&gt;Email&lt;/label&gt;
                &lt;input id=&quot;${id}e&quot; class=&quot;a-in&quot; type=&quot;email&quot; value=&quot;${row.prefill ? p.email : &quot;&quot;}&quot; placeholder=&quot;name@email.com&quot;&gt;
              &lt;/div&gt;
              &lt;div class=&quot;field-row&quot;&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}d&quot;&gt;Date of birth&lt;/label&gt;
                  &lt;input id=&quot;${id}d&quot; class=&quot;a-in&quot; type=&quot;date&quot; value=&quot;${row.prefill ? p.dob : &quot;&quot;}&quot; aria-describedby=&quot;${id}de&quot;&gt;
                  &lt;p class=&quot;f-err&quot; id=&quot;${id}de&quot; role=&quot;alert&quot;&gt;
                    &lt;svg width=&quot;13&quot; height=&quot;13&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
                      &lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot;/&gt;
                      &lt;path d=&quot;M12 7.5v5&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot; stroke-linecap=&quot;round&quot;/&gt;
                      &lt;circle cx=&quot;12&quot; cy=&quot;16.3&quot; r=&quot;1&quot; fill=&quot;currentColor&quot;/&gt;
                    &lt;/svg&gt;
                    &lt;span&gt;Must be ${AGE_LIMIT} or older&lt;/span&gt;
                  &lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}g&quot;&gt;Gender&lt;/label&gt;
                  &lt;select id=&quot;${id}g&quot; class=&quot;a-in&quot;&gt;
                    &lt;option value=&quot;&quot; ${row.prefill &amp;&amp; p.gender ? &quot;&quot; : &quot;selected&quot;} disabled&gt;Select&lt;/option&gt;
                    ${GENDERS.map(([v, t]) =&gt;
                      `&lt;option value=&quot;${v}&quot; ${row.prefill &amp;&amp; p.gender === v ? &quot;selected&quot; : &quot;&quot;}&gt;${t}&lt;/option&gt;`
                    ).join(&quot;&quot;)}
                  &lt;/select&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;`;
        wrap.appendChild(el);

        el.querySelector(&quot;.att-hd&quot;).addEventListener(&quot;click&quot;, () =&gt; {
          const hd = el.querySelector(&quot;.att-hd&quot;);
          const nowOpen = hd.getAttribute(&quot;aria-expanded&quot;) !== &quot;true&quot;;
          hd.setAttribute(&quot;aria-expanded&quot;, String(nowOpen));
          el.querySelector(&quot;.att-body&quot;).classList.toggle(&quot;open&quot;, nowOpen);
        });
        el.querySelectorAll(&quot;.a-in&quot;).forEach((i) =&gt; {
          i.addEventListener(&quot;input&quot;, render);
          i.addEventListener(&quot;change&quot;, render);
        });
      });
    });

    autoExpand();
  }

  /* Open the first panel that still needs work, and only that one.
     Attendee 1 is usually prefilled and valid, so it collapses and the form
     opens on attendee 2 — the first thing you actually have to fill.
     If attendee 1 is invalid (e.g. the buyer is under-age), it stays open
     because that's the panel to fix. Runs on build only, never on keystroke,
     so panels don't jump around while you type. */
  function autoExpand() {
    const panels = [...$(&quot;att-list&quot;).querySelectorAll(&quot;.att-acc&quot;)];
    const target = panels.find((p) =&gt; !panelValid(p));
    panels.forEach((p) =&gt; {
      const open = p === target;
      p.querySelector(&quot;.att-hd&quot;).setAttribute(&quot;aria-expanded&quot;, String(open));
      p.querySelector(&quot;.att-body&quot;).classList.toggle(&quot;open&quot;, open);
    });
  }

  const profileValid = () =&gt;
    state.profileDone || [...document.querySelectorAll(&quot;.p-in&quot;)].every((e) =&gt; e.value.trim() !== &quot;&quot;);

  /* Panel headers mirror production: status icon (check when valid, person when
     not), typed name or &quot;Attendee N&quot;, &quot;(You)&quot; on the first panel overall. */
  function refreshPanels() {
    const panels = [...$(&quot;att-list&quot;).querySelectorAll(&quot;.att-acc&quot;)];
    let complete = 0;
    panels.forEach((p, i) =&gt; {
      const ok = panelValid(p);
      if (ok) complete++;
      p.classList.toggle(&quot;valid&quot;, ok);
      p.querySelector(&quot;.att-ico&quot;).innerHTML = ok ? ICON_CHECK : ICON_PERSON;

      /* Age is measured at the EVENT date, not today — so the error names that
         date. Only fires once a date is entered; empty is not an error. */
      const dobEl = p.querySelector('input[type=&quot;date&quot;]');
      const a = ageAt(dobEl.value, EVENT_START);
      const underage = dobEl.value !== &quot;&quot; &amp;&amp; a !== null &amp;&amp; a &lt; AGE_LIMIT;
      dobEl.classList.toggle(&quot;bad&quot;, underage);
      dobEl.setAttribute(&quot;aria-invalid&quot;, String(underage));
      p.querySelector(&quot;.f-err&quot;).classList.toggle(&quot;on&quot;, underage);
      const first = p.querySelector('input[id$=&quot;f&quot;]').value.trim();
      const last = p.querySelector('input[id$=&quot;l&quot;]').value.trim();
      const name = [first, last].filter(Boolean).join(&quot; &quot;) || `Attendee ${i + 1}`;
      p.querySelector(&quot;.att-nm&quot;).innerHTML =
        name + (i === 0 ? &quot; &lt;em&gt;(You)&lt;/em&gt;&quot; : &quot;&quot;);
    });
    return { complete, total: panels.length };
  }
  function attendeeStats() { return refreshPanels(); }

  /* ---------------- Totals (fee is carved out, never added) ---------------- */
  const FEE_PER_TICKET = 38, DISC_RATE = 0.2;
  let coupon = false;
  const fmt = (n) =&gt; Math.round(n).toLocaleString(&quot;en-US&quot;) + &quot; THB&quot;;
  const itemLabel = (i) =&gt; (i.category ? `${i.category}/${i.name}` : i.name);

  /* Summary line per chosen ticket type, with an optional discount sub-line. */
  function renderOrderItems(showDisc) {
    $(&quot;ord-items&quot;).innerHTML = ORDER.items.map((i) =&gt; {
      const line = i.qty * i.unit;
      const row = `&lt;div class=&quot;ord-row item&quot;&gt;&lt;span class=&quot;n&quot;&gt;&lt;b&gt;${i.qty}&lt;/b&gt; ${itemLabel(i)}&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${fmt(line)}&lt;/span&gt;&lt;/div&gt;`;
      const dl = showDisc
        ? `&lt;div class=&quot;ord-line-disc&quot;&gt;&lt;span&gt;AFTER20 - 20%&lt;/span&gt;&lt;span&gt;-${fmt(line * DISC_RATE)}&lt;/span&gt;&lt;/div&gt;`
        : &quot;&quot;;
      return row + dl;
    }).join(&quot;&quot;);
  }

  function render() {
    const free = $(&quot;t-free&quot;).classList.contains(&quot;on&quot;);
    const approval = $(&quot;t-approval&quot;).classList.contains(&quot;on&quot;);
    const feesOn = $(&quot;t-fees&quot;).classList.contains(&quot;on&quot;);

    // ---- summary
    const SUB = orderSub(), TICKETS = orderCount(), FEE = FEE_PER_TICKET * TICKETS;
    const showDisc = coupon &amp;&amp; !free;
    const showFees = feesOn &amp;&amp; !free;
    const disc = coupon ? SUB * DISC_RATE : 0;
    const fee = showFees ? FEE : 0;
    const subBeforeFees = showFees ? SUB - FEE : SUB;
    const total = free ? 0 : Math.max(0, Math.round(subBeforeFees + fee - disc));

    $(&quot;ord-count&quot;).textContent = `${TICKETS} ${TICKETS === 1 ? &quot;ticket&quot; : &quot;tickets&quot;}`;
    renderOrderItems(showDisc);
    $(&quot;breakdown&quot;).hidden = !(showDisc || showFees);
    $(&quot;sub-label&quot;).textContent = showFees ? &quot;Ticket subtotal&quot; : &quot;Subtotal&quot;;
    $(&quot;sub-v&quot;).textContent = fmt(subBeforeFees);
    $(&quot;fee-row&quot;).hidden = !showFees;
    $(&quot;fee-v&quot;).textContent = fmt(fee);
    $(&quot;disc-row&quot;).hidden = !showDisc;
    $(&quot;disc-v&quot;).textContent = &quot;-&quot; + fmt(disc);
    $(&quot;total-v&quot;).textContent = free ? &quot;Free&quot; : fmt(total);
    $(&quot;coupon-input-wrap&quot;).hidden = coupon;
    $(&quot;code-chip&quot;).hidden = !coupon;

    // ---- attendees view
    // the age policy belongs to the event, so it shows whenever there's a limit —
    // not only when someone has already failed it
    $(&quot;age-note&quot;).hidden = !(AGE_LIMIT &gt; 0);
    const s = attendeeStats();
    $(&quot;att-count&quot;).textContent = `${s.complete}/${s.total} complete`;
    $(&quot;att-sub&quot;).textContent = isIndividual()
      ? &quot;Enter details for each ticket holder&quot;
      : requiresGroupAgeCorrection()
        ? &quot;Confirm the main attendee meets the event age requirement&quot;
        : &quot;Review the main attendee's details&quot;;
    $(&quot;cta-attendees&quot;).disabled = s.complete !== s.total;

    // ---- gates
    $(&quot;cta-profile&quot;).disabled = !profileValid();
    /* Payment always offers a way back. Production renders this link only when
       attendees were collected, which leaves a repeat group buyer — who lands
       straight on Payment with a complete profile — with no way to review or
       correct anything. */
    $(&quot;back-attendees&quot;).hidden = false;

    // ---- view 2 identity follows whether money is involved
    $(&quot;step-pay-label&quot;).textContent = free ? &quot;Confirm&quot; : &quot;Pay&quot;;
    $(&quot;pay-title&quot;).textContent = free ? &quot;Confirm&quot; : &quot;Payment&quot;;
    $(&quot;pay-sub&quot;).textContent = free
      ? &quot;Nothing to pay — review and confirm&quot;
      : approval
        ? &quot;We'll hold the amount, not charge it&quot;
        : &quot;Card details are handled by Stripe&quot;;
    $(&quot;pay-form&quot;).hidden = free;
    $(&quot;free-note&quot;).hidden = !free;
    if (free) {
      $(&quot;free-note-txt&quot;).innerHTML = coupon
        ? &quot;&lt;b&gt;No payment required.&lt;/b&gt; Your discount code covers the full amount.&quot;
        : &quot;&lt;b&gt;No payment required.&lt;/b&gt; This is a free registration event.&quot;;
    }
    /* Button text does not change for approval — the hold is explained by the
       notice below it, not by renaming the action. */
    $(&quot;cta-pay&quot;).textContent = free
      ? (approval ? &quot;Submit registration&quot; : &quot;Complete registration&quot;)
      : &quot;Pay &quot; + fmt(total);
    $(&quot;approval-note&quot;).hidden = !approval;
    if (approval) {
      /* Paid + approval uses Stripe capture_method: &quot;manual&quot; — the card is only
         authorised now and captured when the organizer approves. Say that. */
      $(&quot;approval-txt&quot;).innerHTML = free
        ? &quot;&lt;b&gt;The organizer reviews each registration.&lt;/b&gt; You'll get an email when it's confirmed.&quot;
        : &quot;&lt;b&gt;You won't be charged until the organizer approves.&lt;/b&gt; We'll hold the amount on your card and email you either way.&quot;;
    }

    // ---- view switch
    $(&quot;view-profile&quot;).hidden = state.view !== &quot;profile&quot;;
    $(&quot;view-attendees&quot;).hidden = state.view !== &quot;attendees&quot;;
    $(&quot;view-payment&quot;).hidden = state.view !== &quot;payment&quot;;
  }

  :root {

      &lt;rect x=&quot;34&quot; y=&quot;76&quot; width=&quot;32&quot; height=&quot;2.5&quot; rx=&quot;1.25&quot; style=&quot;fill:var(--sky-c)&quot; opacity=&quot;0.55&quot;/&gt;
      &lt;rect x=&quot;40&quot; y=&quot;83&quot; width=&quot;20&quot; height=&quot;2&quot; rx=&quot;1&quot; style=&quot;fill:var(--sky-c)&quot; opacity=&quot;0.35&quot;/&gt;
    &lt;/svg&gt;
    &lt;/div&gt;
    &lt;span class=&quot;stamp&quot; id=&quot;stamp&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;
        &lt;path d=&quot;M5 13l4 4L19 7&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;/svg&gt;

  &lt;/div&gt;

  &lt;h1 class=&quot;headline&quot; id=&quot;headline&quot;&gt;Order confirmed&lt;/h1&gt;
  &lt;p class=&quot;sub&quot; id=&quot;sub&quot;&gt;Your tickets have been sent to &lt;b&gt;eldar@example.com&lt;/b&gt;.&lt;/p&gt;
  &lt;p class=&quot;ev-line&quot;&gt;&lt;b&gt;Afterlight Bangkok&lt;/b&gt; · Sat, Sep 12 · 23:00 · Sphere Hall&lt;/p&gt;

  &lt;!-- Pending approval — production copy, incl. the 7-day hold release --&gt;
  &lt;p class=&quot;notice&quot; id=&quot;approval-note&quot; hidden&gt;
    &lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot;/&gt;
      &lt;path d=&quot;M12 7.6V12l2.6 1.6&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot;/&gt;
    &lt;/svg&gt;
    &lt;span&gt;
      &lt;b&gt;Pending approval&lt;/b&gt;
      &lt;span&gt;The event organizer will review your request. You'll receive an email when your tickets are approved or if more information is needed. If not approved within 7 days, the hold on your card will be automatically released.&lt;/span&gt;

  &lt;p class=&quot;lbl&quot;&gt;

  &lt;/p&gt;

  &lt;!-- one row per ticket: same type listed separately, each with holder +
       number. Rendered from the order carried through from Choose Ticket. --&gt;

  &lt;div id=&quot;breakdown&quot; hidden&gt;
    &lt;div class=&quot;sum-row&quot;&gt;&lt;span class=&quot;n&quot; id=&quot;sub-label&quot;&gt;Subtotal&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;sub-v&quot;&gt;1,900 THB&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sum-row&quot; id=&quot;fee-row&quot; hidden&gt;&lt;span class=&quot;n&quot;&gt;Fees &amp;amp; commissions&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;fee-v&quot;&gt;114 THB&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sum-row disc&quot; id=&quot;disc-row&quot; hidden&gt;&lt;span class=&quot;n&quot;&gt;Discounts&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;disc-v&quot;&gt;-380 THB&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sum-sep&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;sum-row total&quot;&gt;&lt;span class=&quot;n&quot;&gt;Total (incl. VAT)&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;total-v&quot;&gt;1,900 THB&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;actions&quot;&gt;

    &lt;div class=&quot;row-btns&quot;&gt;

          &lt;rect x=&quot;3.5&quot; y=&quot;5.5&quot; width=&quot;17&quot; height=&quot;15&quot; rx=&quot;2.5&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot;/&gt;
          &lt;path d=&quot;M3.5 10h17M8 3.5v4M16 3.5v4&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;/svg&gt;
        Add to calendar
      &lt;/button&gt;
      &lt;button class=&quot;btn2&quot; id=&quot;btn-share&quot;&gt;
        &lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;path d=&quot;M12 3v12M12 3l-4 4M12 3l4 4M5 13v6h14v-6&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
        &lt;/svg&gt;
        Share event
      &lt;/button&gt;
