    &lt;small style=&quot;display:block; margin-bottom:1.3rem;&quot;&gt;Your tickets are held for 10 minutes. Leaving releases them.&lt;/small&gt;
    &lt;button class=&quot;cta&quot; id=&quot;leave-stay&quot; style=&quot;margin:0 0 0.6rem;&quot;&gt;Keep my tickets&lt;/button&gt;
    &lt;button class=&quot;backlink&quot; id=&quot;leave-go&quot; style=&quot;margin:0 auto; display:block;&quot;&gt;Leave anyway&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- preview toggles hidden for clean review — machinery kept --&gt;
&lt;div class=&quot;demo-bar&quot; style=&quot;display:none&quot;&gt;
  &lt;b&gt;Mode&lt;/b&gt;
  &lt;button class=&quot;tgl on&quot; id=&quot;m-group&quot; data-mode=&quot;group&quot;&gt;Group&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;m-individual&quot; data-mode=&quot;individual&quot;&gt;Individual&lt;/button&gt;
  &lt;span class=&quot;fdiv&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
  &lt;button class=&quot;tgl on&quot; id=&quot;t-profile&quot; aria-pressed=&quot;true&quot;&gt;Profile done&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-under18&quot; aria-pressed=&quot;false&quot;&gt;Buyer under age&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-fees&quot; aria-pressed=&quot;false&quot;&gt;Fees&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-free&quot; aria-pressed=&quot;false&quot;&gt;Free&lt;/button&gt;
  &lt;button class=&quot;tgl&quot; id=&quot;t-approval&quot; aria-pressed=&quot;false&quot;&gt;Approval&lt;/button&gt;
&lt;/div&gt;

&lt;script&gt;
  /* ---- Cross-page navigation ------------------------------------------
     The four mockups are separate files. Navigate between them relatively
     when opened locally (all in one folder), or by artifact URL when viewed
     on claude.ai — so the flow connects in both places. */
  const NAV = (() =&gt; {
    const A = {
      event:    &quot;https://claude.ai/code/artifact/77f4ef1f-f3a4-4ee2-b89b-02127d17edc5&quot;,
      select:   &quot;https://claude.ai/code/artifact/47fb6c2a-121e-4972-95a6-8c5a9e8bae19&quot;,
      checkout: &quot;https://claude.ai/code/artifact/c7332fcc-5b94-40ac-9f12-b3026e750ccb&quot;,
      confirm:  &quot;https://claude.ai/code/artifact/44ecbc66-1bd3-4ce2-a6bc-829459ae7cd8&quot;,
    };
    const R = {
      event:    &quot;bumpy-event-page-mockup.html&quot;,
      select:   &quot;bumpy-ticket-selection-mockup.html&quot;,
      checkout: &quot;bumpy-checkout-mockup.html&quot;,
      confirm:  &quot;bumpy-confirmation-mockup.html&quot;,
    };
    const onArtifact = /(^|\.)claude\.ai$/.test(location.hostname);
    return (key) =&gt; {
      // inside the combined flow shell: switch views without navigating
      try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ bumpyNav: key }, &quot;*&quot;); return; } } catch (e) {}
      window.location.href = (onArtifact ? A : R)[key];
    };
  })();

  const $ = (id) =&gt; document.getElementById(id);

  /* ---- Order carried from the Choose Ticket step ----------------------
     Each line: { name, category, qty, unit }. When this page is opened on
     its own (no order handed over), fall back to a representative order so
     it still reads as a complete page. */
  const DEFAULT_ORDER = { items: [
    { name: &quot;Phase 1&quot;, category: null, qty: 2, unit: 1390 },
    { name: &quot;VIP experience&quot;, category: null, qty: 1, unit: 4990 },
  ] };
  let ORDER = DEFAULT_ORDER;
  const orderCount = () =&gt; ORDER.items.reduce((s, i) =&gt; s + i.qty, 0);
  const orderSub = () =&gt; ORDER.items.reduce((s, i) =&gt; s + i.qty * i.unit, 0);

  window.addEventListener(&quot;message&quot;, (e) =&gt; {
    const o = e.data &amp;&amp; e.data.bumpyOrder;
    if (o &amp;&amp; Array.isArray(o.items) &amp;&amp; o.items.length) {
      ORDER = o;
      buildAttendees();   // attendee slots follow the chosen tickets
      render();
    }
  });

  /* ==================================================================
     Production logic (CheckoutPageClient.tsx):
       isIndividualMode         = event.dealType === &quot;individual&quot;
       requiresGroupAgeCorrection = !individual &amp;&amp; hasAgeRestriction
                                    &amp;&amp; profileComplete &amp;&amp; buyerAge &lt; ageLimit
       requiresAttendeeDetails  = isIndividualMode || requiresGroupAgeCorrection
       getInitialPaySubStep()   = !profileComplete ? &quot;profile&quot;
                                : requiresAttendeeDetails ? &quot;attendees&quot;
                                : &quot;payment&quot;
     Group + no age issue therefore has NO attendee step at all.
     ================================================================== */
  /* `profile` holds what the buyer actually submitted this session — production's
     `profileData`, which also short-circuits isProfileComplete to true. */
  const state = { mode: &quot;group&quot;, profileDone: true, under18: false, view: &quot;payment&quot;, profile: null };

  const isIndividual = () =&gt; state.mode === &quot;individual&quot;;

  /* The saved profile wins; otherwise fall back to the demo's stored customer. */
  function buyerProfile() {
    return state.profile || {
      first: &quot;Eldar&quot;, last: &quot;Tsabari&quot;, email: &quot;eldar@example.com&quot;,
      dob: state.under18 ? DOB_UNDER : DOB_OK, gender: &quot;male&quot;,
    };
  }
  const buyerDob = () =&gt; buyerProfile().dob;

  /* Group + age-restricted event + the BUYER is under the limit → collect the
     main attendee so the age can be corrected. Judged from the buyer's real
     birth date, so a date just typed into the profile form drives the routing
     (production: getRequiresAttendeeDetailsForProfile(submittedProfile)). */
  function requiresGroupAgeCorrection() {
    if (isIndividual()) return false;
    const a = ageAt(buyerDob(), EVENT_START);
    return a !== null &amp;&amp; a &lt; AGE_LIMIT;
  }
  const requiresAttendeeDetails = () =&gt; isIndividual() || requiresGroupAgeCorrection();

  /* Routing — mirrors getInitialPaySubStep() + the advance effect:
       !profileComplete            → profile
       requiresAttendeeDetails     → attendees
       otherwise                   → payment
     Individual ALWAYS gets attendees; group only when the buyer is under-age. */
  const stepAfterProfile = () =&gt; (requiresAttendeeDetails() ? &quot;attendees&quot; : &quot;payment&quot;);
  const initialView = () =&gt;
    !state.profileDone ? &quot;profile&quot; : stepAfterProfile();

  /* Attendee groups — built from cart items in production (one slot per ticket).
     individual → every ticket needs an attendee (AttendeesList mode=&quot;all&quot;)
     under-age  → a single synthetic &quot;Main attendee&quot; group, quantity 1,
                  prefilled from the profile (mode=&quot;primary&quot;) */
  const EVENT_START = &quot;2027-09-01&quot;;   // age is measured at the event date
  const AGE_LIMIT = 21;               // event.age_limit — the event is 21+
  /* The &quot;Buyer under age&quot; toggle must change the buyer's actual birth date,
     not just the routing — that date is what prefills the main attendee and
     what the age check judges. 2012 → 15 at the event; 1997 → 30. */
  const DOB_UNDER = &quot;2012-01-01&quot;;
  const DOB_OK = &quot;1997-04-12&quot;;

  /* A ticket that belongs to a category reads &quot;Category/Ticket&quot;. On the
     selection page the category is an accordion, so the nesting is visual;
     in checkout that hierarchy is gone, so the category has to travel inline
     with the name or &quot;Deck entry&quot; loses its context. */
  const ticketLabel = (t) =&gt; (t.category ? `${t.category}/${t.ticketName}` : t.ticketName);

  function attendeeGroups() {
    /* Individual: one attendee per ticket, grouped by ticket type (mode &quot;all&quot;).
       Group: a single &quot;Main attendee&quot; prefilled from the profile (mode &quot;primary&quot;)
       — required only for age correction, but always REACHABLE so a repeat buyer
       can review or fix their details at purchase time. */
    if (isIndividual()) {
      // one attendee slot per ticket, grouped by type; the very first slot
      // overall is prefilled from the buyer's profile
      let prefilled = false;
      return ORDER.items.map((i) =&gt; ({
        ticketName: i.name, category: i.category, quantity: i.qty,
        rows: Array.from({ length: i.qty }, () =&gt; {
          if (!prefilled) { prefilled = true; return { prefill: true }; }
          return {};
        }),
      }));
    }
    return [{ ticketName: &quot;Main attendee&quot;, category: null, quantity: 1, rows: [{ prefill: true }] }];
  }

  function ageAt(dob, target) {
    if (!dob) return null;
    const t = new Date(target), b = new Date(dob + &quot;T00:00:00&quot;);
    if (isNaN(t) || isNaN(b)) return null;
    let a = t.getFullYear() - b.getFullYear();
    const m = t.getMonth() - b.getMonth();
    if (m &lt; 0 || (m === 0 &amp;&amp; t.getDate() &lt; b.getDate())) a--;
    return a;
  }

  /* Production isAttendeeDataValid: all five fields, plus age &gt;= ageLimit at
     the event date when the event has an age restriction. */
  function panelValid(panel) {
    const vals = [...panel.querySelectorAll(&quot;.a-in&quot;)];
    if (!vals.every((e) =&gt; e.value.trim() !== &quot;&quot;)) return false;
    const dob = panel.querySelector('input[type=&quot;date&quot;]').value;
    const a = ageAt(dob, EVENT_START);
    return a !== null &amp;&amp; a &gt;= AGE_LIMIT;
  }

  const ICON_CHECK = '&lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 13l4 4L19 7&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;';
  const ICON_PERSON = '&lt;svg width=&quot;16&quot; height=&quot;16&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;8&quot; r=&quot;3.4&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;path d=&quot;M5.5 19.5a6.5 6.5 0 0 1 13 0&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/svg&gt;';

  function buildAttendees() {
    const wrap = $(&quot;att-list&quot;);
    wrap.innerHTML = &quot;&quot;;
    const groups = attendeeGroups();
    const p = buyerProfile();   // attendee 1 mirrors the buyer's saved profile
    const GENDERS = [[&quot;male&quot;, &quot;Male&quot;], [&quot;female&quot;, &quot;Female&quot;], [&quot;other&quot;, &quot;Other&quot;]];
    let n = 0;

    groups.forEach((g) =&gt; {
      // production: ticket-type header only when there's more than one group
      if (groups.length &gt; 1) {
        const h = document.createElement(&quot;p&quot;);
        h.className = &quot;grp-hd&quot;;
        h.textContent = `${ticketLabel(g)} (${g.quantity} ${g.quantity === 1 ? &quot;ticket&quot; : &quot;tickets&quot;})`;
        wrap.appendChild(h);
      }
      g.rows.forEach((row) =&gt; {
        const idx = n++;
        const id = &quot;at&quot; + idx;
        const el = document.createElement(&quot;div&quot;);
        el.className = &quot;att-acc&quot;;
        el.dataset.idx = idx;
        // built collapsed; autoExpand() below opens the first one that needs work
        const open = false;
        el.innerHTML = `
          &lt;button type=&quot;button&quot; class=&quot;att-hd&quot; aria-expanded=&quot;${open}&quot; aria-controls=&quot;${id}b&quot;&gt;
            &lt;span class=&quot;att-ico&quot; aria-hidden=&quot;true&quot;&gt;${ICON_PERSON}&lt;/span&gt;
            &lt;span class=&quot;att-nm&quot;&gt;&lt;/span&gt;
            &lt;svg class=&quot;att-chev&quot; width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
              &lt;path d=&quot;M6 9l6 6 6-6&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
            &lt;/svg&gt;
          &lt;/button&gt;
          &lt;div class=&quot;att-body ${open ? &quot;open&quot; : &quot;&quot;}&quot; id=&quot;${id}b&quot;&gt;
            &lt;div&gt;&lt;div class=&quot;att-well&quot;&gt;
              &lt;div class=&quot;field-row&quot;&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}f&quot;&gt;First name&lt;/label&gt;
                  &lt;input id=&quot;${id}f&quot; class=&quot;a-in&quot; value=&quot;${row.prefill ? p.first : &quot;&quot;}&quot; placeholder=&quot;First name&quot;&gt;
                &lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}l&quot;&gt;Last name&lt;/label&gt;
                  &lt;input id=&quot;${id}l&quot; class=&quot;a-in&quot; value=&quot;${row.prefill ? p.last : &quot;&quot;}&quot; placeholder=&quot;Last name&quot;&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;field&quot;&gt;
                &lt;label for=&quot;${id}e&quot;&gt;Email&lt;/label&gt;
                &lt;input id=&quot;${id}e&quot; class=&quot;a-in&quot; type=&quot;email&quot; value=&quot;${row.prefill ? p.email : &quot;&quot;}&quot; placeholder=&quot;name@email.com&quot;&gt;
              &lt;/div&gt;
              &lt;div class=&quot;field-row&quot;&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}d&quot;&gt;Date of birth&lt;/label&gt;
                  &lt;input id=&quot;${id}d&quot; class=&quot;a-in&quot; type=&quot;date&quot; value=&quot;${row.prefill ? p.dob : &quot;&quot;}&quot; aria-describedby=&quot;${id}de&quot;&gt;
                  &lt;p class=&quot;f-err&quot; id=&quot;${id}de&quot; role=&quot;alert&quot;&gt;
                    &lt;svg width=&quot;13&quot; height=&quot;13&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
                      &lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot;/&gt;
                      &lt;path d=&quot;M12 7.5v5&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot; stroke-linecap=&quot;round&quot;/&gt;
                      &lt;circle cx=&quot;12&quot; cy=&quot;16.3&quot; r=&quot;1&quot; fill=&quot;currentColor&quot;/&gt;
                    &lt;/svg&gt;
                    &lt;span&gt;Must be ${AGE_LIMIT} or older&lt;/span&gt;
                  &lt;/p&gt;
                &lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;${id}g&quot;&gt;Gender&lt;/label&gt;
                  &lt;select id=&quot;${id}g&quot; class=&quot;a-in&quot;&gt;
                    &lt;option value=&quot;&quot; ${row.prefill &amp;&amp; p.gender ? &quot;&quot; : &quot;selected&quot;} disabled&gt;Select&lt;/option&gt;
                    ${GENDERS.map(([v, t]) =&gt;
                      `&lt;option value=&quot;${v}&quot; ${row.prefill &amp;&amp; p.gender === v ? &quot;selected&quot; : &quot;&quot;}&gt;${t}&lt;/option&gt;`
                    ).join(&quot;&quot;)}
                  &lt;/select&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;`;
        wrap.appendChild(el);

        el.querySelector(&quot;.att-hd&quot;).addEventListener(&quot;click&quot;, () =&gt; {
          const hd = el.querySelector(&quot;.att-hd&quot;);
          const nowOpen = hd.getAttribute(&quot;aria-expanded&quot;) !== &quot;true&quot;;
          hd.setAttribute(&quot;aria-expanded&quot;, String(nowOpen));
          el.querySelector(&quot;.att-body&quot;).classList.toggle(&quot;open&quot;, nowOpen);
        });
        el.querySelectorAll(&quot;.a-in&quot;).forEach((i) =&gt; {
          i.addEventListener(&quot;input&quot;, render);
          i.addEventListener(&quot;change&quot;, render);
        });
      });
    });

    autoExpand();
  }

  /* Open the first panel that still needs work, and only that one.
     Attendee 1 is usually prefilled and valid, so it collapses and the form
     opens on attendee 2 — the first thing you actually have to fill.
     If attendee 1 is invalid (e.g. the buyer is under-age), it stays open
     because that's the panel to fix. Runs on build only, never on keystroke,
     so panels don't jump around while you type. */
  function autoExpand() {
    const panels = [...$(&quot;att-list&quot;).querySelectorAll(&quot;.att-acc&quot;)];
    const target = panels.find((p) =&gt; !panelValid(p));
    panels.forEach((p) =&gt; {
      const open = p === target;
      p.querySelector(&quot;.att-hd&quot;).setAttribute(&quot;aria-expanded&quot;, String(open));
      p.querySelector(&quot;.att-body&quot;).classList.toggle(&quot;open&quot;, open);
    });
  }

  const profileValid = () =&gt;
    state.profileDone || [...document.querySelectorAll(&quot;.p-in&quot;)].every((e) =&gt; e.value.trim() !== &quot;&quot;);

  /* Panel headers mirror production: status icon (check when valid, person when
     not), typed name or &quot;Attendee N&quot;, &quot;(You)&quot; on the first panel overall. */
  function refreshPanels() {
    const panels = [...$(&quot;att-list&quot;).querySelectorAll(&quot;.att-acc&quot;)];
    let complete = 0;
    panels.forEach((p, i) =&gt; {
      const ok = panelValid(p);
      if (ok) complete++;
      p.classList.toggle(&quot;valid&quot;, ok);
      p.querySelector(&quot;.att-ico&quot;).innerHTML = ok ? ICON_CHECK : ICON_PERSON;

      /* Age is measured at the EVENT date, not today — so the error names that
         date. Only fires once a date is entered; empty is not an error. */
      const dobEl = p.querySelector('input[type=&quot;date&quot;]');
      const a = ageAt(dobEl.value, EVENT_START);
      const underage = dobEl.value !== &quot;&quot; &amp;&amp; a !== null &amp;&amp; a &lt; AGE_LIMIT;
      dobEl.classList.toggle(&quot;bad&quot;, underage);
      dobEl.setAttribute(&quot;aria-invalid&quot;, String(underage));
      p.querySelector(&quot;.f-err&quot;).classList.toggle(&quot;on&quot;, underage);
      const first = p.querySelector('input[id$=&quot;f&quot;]').value.trim();
      const last = p.querySelector('input[id$=&quot;l&quot;]').value.trim();
      const name = [first, last].filter(Boolean).join(&quot; &quot;) || `Attendee ${i + 1}`;
      p.querySelector(&quot;.att-nm&quot;).innerHTML =
        name + (i === 0 ? &quot; &lt;em&gt;(You)&lt;/em&gt;&quot; : &quot;&quot;);
    });
    return { complete, total: panels.length };
  }
  function attendeeStats() { return refreshPanels(); }

  /* ---------------- Totals (fee is carved out, never added) ---------------- */
  const FEE_PER_TICKET = 38, DISC_RATE = 0.2;
  let coupon = false;
  const fmt = (n) =&gt; Math.round(n).toLocaleString(&quot;en-US&quot;) + &quot; THB&quot;;
  const itemLabel = (i) =&gt; (i.category ? `${i.category}/${i.name}` : i.name);

  /* Summary line per chosen ticket type, with an optional discount sub-line. */
  function renderOrderItems(showDisc) {
    $(&quot;ord-items&quot;).innerHTML = ORDER.items.map((i) =&gt; {
      const line = i.qty * i.unit;
      const row = `&lt;div class=&quot;ord-row item&quot;&gt;&lt;span class=&quot;n&quot;&gt;&lt;b&gt;${i.qty}&lt;/b&gt; ${itemLabel(i)}&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${fmt(line)}&lt;/span&gt;&lt;/div&gt;`;
      const dl = showDisc
        ? `&lt;div class=&quot;ord-line-disc&quot;&gt;&lt;span&gt;AFTER20 - 20%&lt;/span&gt;&lt;span&gt;-${fmt(line * DISC_RATE)}&lt;/span&gt;&lt;/div&gt;`
        : &quot;&quot;;
      return row + dl;
    }).join(&quot;&quot;);
  }

  function render() {
    const free = $(&quot;t-free&quot;).classList.contains(&quot;on&quot;);
    const approval = $(&quot;t-approval&quot;).classList.contains(&quot;on&quot;);
    const feesOn = $(&quot;t-fees&quot;).classList.contains(&quot;on&quot;);

    // ---- summary
    const SUB = orderSub(), TICKETS = orderCount(), FEE = FEE_PER_TICKET * TICKETS;
    const showDisc = coupon &amp;&amp; !free;
    const showFees = feesOn &amp;&amp; !free;
    const disc = coupon ? SUB * DISC_RATE : 0;
    const fee = showFees ? FEE : 0;
    const subBeforeFees = showFees ? SUB - FEE : SUB;
    const total = free ? 0 : Math.max(0, Math.round(subBeforeFees + fee - disc));

    $(&quot;ord-count&quot;).textContent = `${TICKETS} ${TICKETS === 1 ? &quot;ticket&quot; : &quot;tickets&quot;}`;
    renderOrderItems(showDisc);
    $(&quot;breakdown&quot;).hidden = !(showDisc || showFees);
    $(&quot;sub-label&quot;).textContent = showFees ? &quot;Ticket subtotal&quot; : &quot;Subtotal&quot;;
    $(&quot;sub-v&quot;).textContent = fmt(subBeforeFees);
    $(&quot;fee-row&quot;).hidden = !showFees;
    $(&quot;fee-v&quot;).textContent = fmt(fee);
    $(&quot;disc-row&quot;).hidden = !showDisc;
    $(&quot;disc-v&quot;).textContent = &quot;-&quot; + fmt(disc);
    $(&quot;total-v&quot;).textContent = free ? &quot;Free&quot; : fmt(total);
    $(&quot;coupon-input-wrap&quot;).hidden = coupon;
    $(&quot;code-chip&quot;).hidden = !coupon;

    // ---- attendees view
    // the age policy belongs to the event, so it shows whenever there's a limit —
    // not only when someone has already failed it
    $(&quot;age-note&quot;).hidden = !(AGE_LIMIT &gt; 0);
    const s = attendeeStats();
    $(&quot;att-count&quot;).textContent = `${s.complete}/${s.total} complete`;
    $(&quot;att-sub&quot;).textContent = isIndividual()
      ? &quot;Enter details for each ticket holder&quot;
      : requiresGroupAgeCorrection()
        ? &quot;Confirm the main attendee meets the event age requirement&quot;
        : &quot;Review the main attendee's details&quot;;
    $(&quot;cta-attendees&quot;).disabled = s.complete !== s.total;

    // ---- gates
    $(&quot;cta-profile&quot;).disabled = !profileValid();
    /* Payment always offers a way back. Production renders this link only when
       attendees were collected, which leaves a repeat group buyer — who lands
       straight on Payment with a complete profile — with no way to review or
       correct anything. */
    $(&quot;back-attendees&quot;).hidden = false;

    // ---- view 2 identity follows whether money is involved
    $(&quot;step-pay-label&quot;).textContent = free ? &quot;Confirm&quot; : &quot;Pay&quot;;
    $(&quot;pay-title&quot;).textContent = free ? &quot;Confirm&quot; : &quot;Payment&quot;;
    $(&quot;pay-sub&quot;).textContent = free
      ? &quot;Nothing to pay — review and confirm&quot;
      : approval
        ? &quot;We'll hold the amount, not charge it&quot;
        : &quot;Card details are handled by Stripe&quot;;
    $(&quot;pay-form&quot;).hidden = free;
    $(&quot;free-note&quot;).hidden = !free;
    if (free) {
      $(&quot;free-note-txt&quot;).innerHTML = coupon
        ? &quot;&lt;b&gt;No payment required.&lt;/b&gt; Your discount code covers the full amount.&quot;
        : &quot;&lt;b&gt;No payment required.&lt;/b&gt; This is a free registration event.&quot;;
    }
    /* Button text does not change for approval — the hold is explained by the
       notice below it, not by renaming the action. */
    $(&quot;cta-pay&quot;).textContent = free
      ? (approval ? &quot;Submit registration&quot; : &quot;Complete registration&quot;)
      : &quot;Pay &quot; + fmt(total);
    $(&quot;approval-note&quot;).hidden = !approval;
    if (approval) {
      /* Paid + approval uses Stripe capture_method: &quot;manual&quot; — the card is only
         authorised now and captured when the organizer approves. Say that. */
      $(&quot;approval-txt&quot;).innerHTML = free
        ? &quot;&lt;b&gt;The organizer reviews each registration.&lt;/b&gt; You'll get an email when it's confirmed.&quot;
        : &quot;&lt;b&gt;You won't be charged until the organizer approves.&lt;/b&gt; We'll hold the amount on your card and email you either way.&quot;;
    }

    // ---- view switch
    $(&quot;view-profile&quot;).hidden = state.view !== &quot;profile&quot;;
    $(&quot;view-attendees&quot;).hidden = state.view !== &quot;attendees&quot;;
    $(&quot;view-payment&quot;).hidden = state.view !== &quot;payment&quot;;
  }

  function go(view) {
    state.view = view;
    render();
    window.scrollTo({ top: 0, behavior: &quot;smooth&quot; });
  }

  /* ---------------- View transitions ---------------- */
  // Profile → attendees (individual, or group+under-age) → otherwise payment.
  // Production uses getRequiresAttendeeDetailsForProfile(submittedProfile) so the
  // decision uses the birth date just entered, not the stale one.
  $(&quot;cta-profile&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    /* Save the profile (production: submit → profileData set → isProfileComplete
       becomes true), then decide the next step from the birth date JUST entered.
       An under-age date is allowed through here — it routes to attendee details,
       where the main attendee is prefilled with it and the error blocks. */
    state.profile = {
      first: $(&quot;p-first&quot;).value.trim(),
      last: $(&quot;p-last&quot;).value.trim(),
      email: $(&quot;p-email&quot;).value.trim(),
      dob: $(&quot;p-dob&quot;).value,
      gender: $(&quot;p-gender&quot;).value,
    };
    state.profileDone = true;
    $(&quot;t-profile&quot;).classList.add(&quot;on&quot;);
    $(&quot;t-profile&quot;).setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
    // keep the demo toggle honest about the saved profile
    const a = ageAt(state.profile.dob, EVENT_START);
    state.under18 = a !== null &amp;&amp; a &lt; AGE_LIMIT;
    $(&quot;t-under18&quot;).classList.toggle(&quot;on&quot;, state.under18);
    $(&quot;t-under18&quot;).setAttribute(&quot;aria-pressed&quot;, String(state.under18));

    buildAttendees();          // attendee 1 now carries the saved details
    go(stepAfterProfile());
  });
  $(&quot;cta-attendees&quot;).addEventListener(&quot;click&quot;, () =&gt; go(&quot;payment&quot;));
  $(&quot;back-attendees&quot;).addEventListener(&quot;click&quot;, () =&gt; go(&quot;attendees&quot;));
  // header back → previous step (Choose Ticket); close → event page
  // Back steps back a page (stays in the funnel, reservation kept, no warning)
  $(&quot;hdr-back&quot;).addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;select&quot;));
  // Close leaves checkout entirely → confirm first, since it releases the hold
  $(&quot;hdr-close&quot;).addEventListener(&quot;click&quot;, () =&gt; $(&quot;leave&quot;).classList.add(&quot;on&quot;));
  $(&quot;leave-stay&quot;).addEventListener(&quot;click&quot;, () =&gt; $(&quot;leave&quot;).classList.remove(&quot;on&quot;));
  $(&quot;leave-go&quot;).addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;event&quot;));

  /* ---------------- Demo controls ---------------- */
  [&quot;m-group&quot;, &quot;m-individual&quot;].forEach((id) =&gt; {
    $(id).addEventListener(&quot;click&quot;, () =&gt; {
      state.mode = $(id).dataset.mode;
      [&quot;m-group&quot;, &quot;m-individual&quot;].forEach((o) =&gt; $(o).classList.toggle(&quot;on&quot;, o === id));
      buildAttendees();
      go(initialView());
    });
  });
  $(&quot;t-profile&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    state.profileDone = !$(&quot;t-profile&quot;).classList.contains(&quot;on&quot;);
    $(&quot;t-profile&quot;).classList.toggle(&quot;on&quot;, state.profileDone);
    $(&quot;t-profile&quot;).setAttribute(&quot;aria-pressed&quot;, String(state.profileDone));
    state.profile = null;                       // back to the stored customer
    if (!state.profileDone) {                   // an incomplete profile starts blank
      [&quot;p-first&quot;, &quot;p-last&quot;, &quot;p-email&quot;, &quot;p-dob&quot;].forEach((i) =&gt; ($(i).value = &quot;&quot;));
      $(&quot;p-gender&quot;).value = &quot;&quot;;
    }
    buildAttendees();
    go(initialView());
  });
  $(&quot;t-under18&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    state.under18 = !$(&quot;t-under18&quot;).classList.contains(&quot;on&quot;);
    $(&quot;t-under18&quot;).classList.toggle(&quot;on&quot;, state.under18);
    $(&quot;t-under18&quot;).setAttribute(&quot;aria-pressed&quot;, String(state.under18));
    state.profile = null;            // the toggle describes the stored customer
    buildAttendees();
    go(initialView());
  });
  [&quot;t-fees&quot;, &quot;t-free&quot;, &quot;t-approval&quot;].forEach((id) =&gt; {
    $(id).addEventListener(&quot;click&quot;, () =&gt; {
      const on = $(id).classList.toggle(&quot;on&quot;);
      $(id).setAttribute(&quot;aria-pressed&quot;, String(on));
      render();
    });
  });
  document.querySelectorAll(&quot;.p-in&quot;).forEach((el) =&gt; {
    el.addEventListener(&quot;input&quot;, render);
    el.addEventListener(&quot;change&quot;, render);
  });

  /* ---------------- Coupon ---------------- */
  const codeEl = $(&quot;code&quot;);
  codeEl.addEventListener(&quot;input&quot;, () =&gt; {
    codeEl.value = codeEl.value.toUpperCase();
    $(&quot;code-err&quot;).hidden = true;
    $(&quot;code-apply&quot;).disabled = codeEl.value.trim() === &quot;&quot;;
  });
  codeEl.addEventListener(&quot;keydown&quot;, (e) =&gt; { if (e.key === &quot;Enter&quot;) { e.preventDefault(); applyCode(); } });
  function applyCode() {
    const v = codeEl.value.trim();
    if (!v) return;
    if (v === &quot;AFTER20&quot;) { coupon = true; codeEl.value = &quot;&quot;; $(&quot;code-apply&quot;).disabled = true; }
    else $(&quot;code-err&quot;).hidden = false;
    render();
  }
  $(&quot;code-apply&quot;).addEventListener(&quot;click&quot;, applyCode);
  $(&quot;code-remove&quot;).addEventListener(&quot;click&quot;, () =&gt; { coupon = false; render(); });

  /* ---------------- Timer ---------------- */
  const TOTAL = 600; let left = 600;
  function tick() {
    const m = Math.floor(left / 60), s = left % 60;
    $(&quot;timer-txt&quot;).textContent = `${String(m).padStart(2,&quot;0&quot;)}:${String(s).padStart(2,&quot;0&quot;)}`;
    $(&quot;timer-fill&quot;).style.width = (left / TOTAL) * 100 + &quot;%&quot;;
    $(&quot;timer&quot;).classList.toggle(&quot;warn&quot;, left &lt;= 120);
    if (left &gt; 0) left--;
  }
  tick(); setInterval(tick, 1000);

  /* ---------------- Submit ---------------- */
  $(&quot;cta-pay&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const free = $(&quot;t-free&quot;).classList.contains(&quot;on&quot;);
    $(&quot;overlay&quot;).querySelector(&quot;p&quot;).textContent = free ? &quot;Submitting registration…&quot; : &quot;Processing payment…&quot;;
    $(&quot;overlay&quot;).classList.add(&quot;on&quot;);
    setTimeout(() =&gt; NAV(&quot;confirm&quot;), 1600);
  });

  buildAttendees();
  state.view = initialView();
  render();
&lt;/script&gt;

&lt;style&gt;
  :root {
    /* ---- Surfaces: the depth ladder. well &lt; bg &lt; glass (recessed → floating) */
    --bg: #0a0a0c;
    --well: #050507;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-2: rgba(255, 255, 255, 0.08);

    --ink: #f6f5f4;

    /* ---- Hairlines */
    --line: rgba(255, 255, 255, 0.09);

    /* ---- Semantic state. Independent of the artwork accent, on purpose. */

    --glow: #f2ff7d;
    --accent-ink: #1a2300;
    --sky-a: #171033; --sky-b: #6d2b8f; --sky-c: #ff9e5a; --sea: #0c0820; /* blue poster; accent stays orange */
  }

    --accent: #c6f543; --glow: #59f0c6; --accent-ink: #101a02;
    --sky-a: #05140d; --sky-b: #103d2a; --sky-c: #c6f543; --sea: #061a12;
  }
  [data-event-theme=&quot;midnight&quot;] {
    --accent: #8b7cff; --glow: #4da6ff; --accent-ink: #0d0824;
    --sky-a: #0a0724; --sky-b: #2b1f6e; --sky-c: #4da6ff; --sea: #0a0a2e;
  }

  * { box-sizing: border-box; }

  }

  .art-wrap {

  .stamp {

  .ev-line {

  .notice {

    margin-top: 1.8rem; padding-top: 1.3rem; border-top: 1px solid var(--line);
    font-size: 0.85rem; color: var(--warn);
  }
  .notice svg { flex-shrink: 0; margin-top: 0.15rem; }
  .notice b { display: block; margin-bottom: 0.15rem; }

  /* ============================================================ ORDER */
  .lbl {

    transition: color var(--dur) ease, border-color var(--dur) ease;

  .tgl.on { color: var(--ink); border-color: #fff; }

  }

  /* One earned moment: the artwork settles and the stamp lands. */
  @media (prefers-reduced-motion: no-preference) {
    .art { animation: settle 520ms var(--ease) both; }
    .stamp { animation: stamp 420ms var(--ease) 260ms both; }
    .headline, .sub, .ev-line { animation: rise 440ms var(--ease) 160ms both; }
    @keyframes settle { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
    @keyframes stamp { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

      event:    &quot;bumpy-event-page-mockup.html&quot;,
      select:   &quot;bumpy-ticket-selection-mockup.html&quot;,
      checkout: &quot;bumpy-checkout-mockup.html&quot;,
      confirm:  &quot;bumpy-confirmation-mockup.html&quot;,
    };
    const onArtifact = /(^|\.)claude\.ai$/.test(location.hostname);
    return (key) =&gt; {
      // inside the combined flow shell: switch views without navigating
      try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ bumpyNav: key }, &quot;*&quot;); return; } } catch (e) {}
      window.location.href = (onArtifact ? A : R)[key];
    };
  })();

  const $ = (id) =&gt; document.getElementById(id);

  // header close → event page (the bottom &quot;Back to event&quot; does the same)
  $(&quot;hdr-close&quot;).addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;event&quot;));

  /* ---- Order carried from Choose Ticket / Pay -------------------------
     Each line: { name, category, qty, unit }. Standalone (no order handed
     over) falls back to a representative order so the page still reads whole. */
  const DEFAULT_ORDER = { items: [
    { name: &quot;Phase 1&quot;, category: null, qty: 2, unit: 1390 },
    { name: &quot;VIP experience&quot;, category: null, qty: 1, unit: 4990 },
  ] };
  let ORDER = DEFAULT_ORDER;
  const orderCount = () =&gt; ORDER.items.reduce((s, i) =&gt; s + i.qty, 0);
  const orderSub = () =&gt; ORDER.items.reduce((s, i) =&gt; s + i.qty * i.unit, 0);
  const itemLabel = (i) =&gt; (i.category ? `${i.category}/${i.name}` : i.name);

  window.addEventListener(&quot;message&quot;, (e) =&gt; {
    const o = e.data &amp;&amp; e.data.bumpyOrder;
    if (o &amp;&amp; Array.isArray(o.items) &amp;&amp; o.items.length) { ORDER = o; render(); }
  });

  /* Demo holder names + ticket numbers, assigned one per ticket. */
  const NAMES = [&quot;Eldar Tsabari&quot;, &quot;Noa Cohen&quot;, &quot;Maya Levi&quot;, &quot;Amit Barak&quot;, &quot;Dana Shaked&quot;,
                 &quot;Yonatan Peled&quot;, &quot;Roni Gal&quot;, &quot;Tomer Katz&quot;];
  const ticketNo = (n) =&gt; &quot;TKT-8F2A&quot; + (41 + n);

  /* Same fee model as the rest of the funnel: the fee is carved OUT of the
     ticket price, so revealing the breakdown never changes the total. */
  const FEE_PER_TICKET = 38, DISC_RATE = 0.2;
  const fmt = (n) =&gt; Math.round(n).toLocaleString(&quot;en-US&quot;) + &quot; THB&quot;;

  /* One .t-row per individual ticket — same type listed separately, each with
     a holder name and ticket number. */
  function renderTicketRows(showDisc) {
    let n = 0;
    const html = [];
    ORDER.items.forEach((i) =&gt; {
      for (let k = 0; k &lt; i.qty; k++) {
        const idx = n++;
        html.push(
          `&lt;div class=&quot;t-row&quot;&gt;
            &lt;div class=&quot;t-top&quot;&gt;
              &lt;span class=&quot;t-name&quot;&gt;${itemLabel(i)}&lt;/span&gt;
              &lt;span class=&quot;t-price&quot;&gt;${fmt(i.unit)}&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;t-meta&quot;&gt;&lt;span&gt;${NAMES[idx % NAMES.length]}&lt;/span&gt;&lt;span class=&quot;t-no&quot;&gt;${ticketNo(idx)}&lt;/span&gt;&lt;/p&gt;
            ${showDisc ? `&lt;div class=&quot;t-disc&quot;&gt;&lt;span&gt;AFTER20 - 20%&lt;/span&gt;&lt;span&gt;-${fmt(i.unit * DISC_RATE)}&lt;/span&gt;&lt;/div&gt;` : &quot;&quot;}
          &lt;/div&gt;`
        );
      }
    });
    $(&quot;t-rows&quot;).innerHTML = html.join(&quot;&quot;);
  }

  function render() {
    const feesOn = $(&quot;t-fees&quot;).classList.contains(&quot;on&quot;);
    const discOn = $(&quot;t-disc&quot;).classList.contains(&quot;on&quot;);
    const free = $(&quot;t-free&quot;).classList.contains(&quot;on&quot;);
    const approval = $(&quot;t-approval&quot;).classList.contains(&quot;on&quot;);

    const SUB = orderSub(), TICKETS = orderCount(), FEE = FEE_PER_TICKET * TICKETS;
    const showDisc = discOn &amp;&amp; !free;
    const disc = showDisc ? SUB * DISC_RATE : 0;
    const showFees = feesOn &amp;&amp; !free;
    const fee = showFees ? FEE : 0;
    const subBeforeFees = showFees ? SUB - FEE : SUB;
    const total = free ? 0 : Math.max(0, Math.round(subBeforeFees + fee - disc));

    $(&quot;oid&quot;).textContent = `#1042 · ${TICKETS} ${TICKETS === 1 ? &quot;ticket&quot; : &quot;tickets&quot;}`;
    renderTicketRows(showDisc);
    $(&quot;breakdown&quot;).hidden = !(showDisc || showFees);
    $(&quot;sub-label&quot;).textContent = showFees ? &quot;Ticket subtotal&quot; : &quot;Subtotal&quot;;
    $(&quot;sub-v&quot;).textContent = fmt(subBeforeFees);
    $(&quot;fee-row&quot;).hidden = !showFees;
    $(&quot;fee-v&quot;).textContent = fmt(fee);
    $(&quot;disc-row&quot;).hidden = !(discOn &amp;&amp; !free);
    $(&quot;disc-v&quot;).textContent = &quot;-&quot; + fmt(disc);
    $(&quot;total-v&quot;).textContent = free ? &quot;Free&quot; : fmt(total);

    // Free orders never went through &quot;Pay&quot;
    $(&quot;step-pay&quot;).textContent = free ? &quot;Confirm&quot; : &quot;Pay&quot;;

    /* Production copy, exactly:
         approval → &quot;Registration submitted&quot; / pending-approval notice
         else     → &quot;Order confirmed&quot; / &quot;Your tickets have been sent to …&quot; */
    $(&quot;headline&quot;).textContent = approval ? &quot;Registration submitted&quot; : &quot;Order confirmed&quot;;
    $(&quot;sub&quot;).innerHTML = approval
      ? 'Your request is pending approval. We\'ll notify you at &lt;b&gt;eldar@example.com&lt;/b&gt; once a decision is made.'
      : 'Your tickets have been sent to &lt;b&gt;eldar@example.com&lt;/b&gt;.';
    $(&quot;approval-note&quot;).hidden = !approval;
    $(&quot;stamp&quot;).classList.toggle(&quot;pending&quot;, approval);
    $(&quot;stamp&quot;).innerHTML = approval
      ? '&lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M12 7.6V12l2.6 1.6&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/svg&gt;'
      : '&lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M5 13l4 4L19 7&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;';
    // tickets only exist once approved
    $(&quot;cta-tickets&quot;).hidden = approval;
  }

  [&quot;t-fees&quot;, &quot;t-disc&quot;, &quot;t-free&quot;, &quot;t-approval&quot;].forEach((id) =&gt; {
    $(id).addEventListener(&quot;click&quot;, () =&gt; {
      const on = $(id).classList.toggle(&quot;on&quot;);
      $(id).setAttribute(&quot;aria-pressed&quot;, String(on));
      render();
    });
  });

  const toast = $(&quot;toast&quot;);
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add(&quot;show&quot;);
    clearTimeout(toast._t);
    toast._t = setTimeout(() =&gt; toast.classList.remove(&quot;show&quot;), 2200);
  }
  $(&quot;cta-tickets&quot;).addEventListener(&quot;click&quot;, () =&gt; say(&quot;→ /profile/tickets&quot;));
  $(&quot;btn-cal&quot;).addEventListener(&quot;click&quot;, () =&gt; say(&quot;→ .ics download&quot;));
  $(&quot;btn-share&quot;).addEventListener(&quot;click&quot;, () =&gt; say(&quot;→ Share the event page&quot;));
  $(&quot;btn-back&quot;).addEventListener(&quot;click&quot;, () =&gt; NAV(&quot;event&quot;));

  render();
&lt;/script&gt;

&lt;title&gt;Bumpy — Login Redesign Mockup&lt;/title&gt;

&lt;style&gt;
  :root {

    line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden;

  }

        &lt;/div&gt;
        &lt;p class=&quot;err&quot; id=&quot;phone-err&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;

        &lt;label class=&quot;fld&quot; style=&quot;margin-top:1.15rem&quot;&gt;Send code via&lt;/label&gt;
        &lt;div class=&quot;seg&quot; id=&quot;seg&quot; role=&quot;radiogroup&quot; aria-label=&quot;Send code via&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;on&quot; id=&quot;seg-sms&quot; role=&quot;radio&quot; aria-checked=&quot;true&quot;&gt;
            &lt;span class=&quot;ico&quot; style=&quot;color:var(--sms)&quot;&gt;
              &lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
                &lt;path d=&quot;M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 16.5H9l-4.5 3v-3H4A1.5 1.5 0 0 1 2.5 15V7A1.5 1.5 0 0 1 4 5.5Z&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linejoin=&quot;round&quot;/&gt;
                &lt;path d=&quot;M7.5 10.5h.01M12 10.5h.01M16.5 10.5h.01&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;
              &lt;/svg&gt;
            &lt;/span&gt;
            SMS
          &lt;/button&gt;
          &lt;button type=&quot;button&quot; id=&quot;seg-wa&quot; role=&quot;radio&quot; aria-checked=&quot;false&quot;&gt;
            &lt;span class=&quot;ico&quot; style=&quot;color:var(--wa)&quot;&gt;
              &lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot; aria-hidden=&quot;true&quot;&gt;
                &lt;path d=&quot;M12.04 2.5a9.5 9.5 0 0 0-8.1 14.42L2.5 21.5l4.7-1.4A9.5 9.5 0 1 0 12.04 2.5Zm0 1.7a7.8 7.8 0 0 1 6.6 11.95c-.2.32-.14.29-.6 2.02l-1.98-.52-.36.21a7.8 7.8 0 1 1-3.66-13.66Zm-3.2 3.6c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.02 0 1.2.87 2.35.99 2.51.12.16 1.7 2.72 4.19 3.71 2.07.82 2.49.66 2.94.62.45-.04 1.45-.59 1.66-1.17.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28-.24-.12-1.45-.72-1.67-.8-.22-.08-.39-.12-.55.12-.16.24-.63.8-.77.96-.14.16-.28.18-.52.06-.24-.12-1.03-.38-1.96-1.21-.72-.64-1.21-1.44-1.35-1.68-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.34-.76-1.83-.2-.47-.4-.41-.55-.42h-.47Z&quot;/&gt;
              &lt;/svg&gt;
            &lt;/span&gt;
            WhatsApp
          &lt;/button&gt;
        &lt;/div&gt;

        &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;

        &lt;p class=&quot;legal&quot;&gt;
          By signing up you accept our
          &lt;a href=&quot;#&quot; onclick=&quot;return false&quot;&gt;terms of use&lt;/a&gt; and
          &lt;a href=&quot;#&quot; onclick=&quot;return false&quot;&gt;privacy policy&lt;/a&gt;.
          We'll text you a code to verify your account (usual rates may apply).
          We'll also text you if you opt into text updates about events (frequency varies).
          To opt out, reply STOP. For help, reply HELP.
        &lt;/p&gt;

        &lt;button class=&quot;cta&quot; id=&quot;continue&quot; type=&quot;submit&quot; disabled&gt;Continue&lt;/button&gt;

        &lt;p class=&quot;recaptcha&quot;&gt;
          Protected by reCAPTCHA — &lt;a href=&quot;#&quot; onclick=&quot;return false&quot;&gt;Privacy&lt;/a&gt; · &lt;a href=&quot;#&quot; onclick=&quot;return false&quot;&gt;Terms&lt;/a&gt;
        &lt;/p&gt;
      &lt;/form&gt;

      &lt;!-- ============ OTP STEP ============ --&gt;
      &lt;form id=&quot;otp-step&quot; hidden novalidate&gt;
        &lt;p class=&quot;sent&quot;&gt;Code sent to &lt;b id=&quot;masked&quot;&gt;+66 •• ••• ••&lt;/b&gt;&lt;/p&gt;

        &lt;div class=&quot;otp&quot; id=&quot;otp&quot; aria-label=&quot;6-digit verification code&quot;&gt;
          &lt;input type=&quot;text&quot; inputmode=&quot;numeric&quot; maxlength=&quot;1&quot; aria-label=&quot;Digit 1&quot;&gt;
          &lt;input type=&quot;text&quot; inputmode=&quot;numeric&quot; maxlength=&quot;1&quot; aria-label=&quot;Digit 2&quot;&gt;
          &lt;input type=&quot;text&quot; inputmode=&quot;numeric&quot; maxlength=&quot;1&quot; aria-label=&quot;Digit 3&quot;&gt;
          &lt;input type=&quot;text&quot; inputmode=&quot;numeric&quot; maxlength=&quot;1&quot; aria-label=&quot;Digit 4&quot;&gt;
          &lt;input type=&quot;text&quot; inputmode=&quot;numeric&quot; maxlength=&quot;1&quot; aria-label=&quot;Digit 5&quot;&gt;
          &lt;input type=&quot;text&quot; inputmode=&quot;numeric&quot; maxlength=&quot;1&quot; aria-label=&quot;Digit 6&quot;&gt;
        &lt;/div&gt;
        &lt;p class=&quot;err&quot; id=&quot;otp-err&quot; role=&quot;alert&quot; style=&quot;justify-content:center&quot;&gt;&lt;/p&gt;

        &lt;div class=&quot;resend&quot;&gt;
          &lt;!-- One shared countdown lives in this label (&quot;Resend in 0:47 via&quot;);
               it holds every channel below until it runs out. --&gt;
          &lt;span class=&quot;resend-lbl&quot; id=&quot;resend-lbl&quot;&gt;Resend via&lt;/span&gt;
          &lt;div class=&quot;channels&quot; id=&quot;channels&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;button class=&quot;cta&quot; id=&quot;verify&quot; type=&quot;submit&quot; disabled&gt;Verify OTP&lt;/button&gt;
        &lt;button class=&quot;textbtn&quot; id=&quot;change-num&quot; type=&quot;button&quot;&gt;Use a different number&lt;/button&gt;
      &lt;/form&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;toast&quot; id=&quot;toast&quot; role=&quot;status&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  /* ---- Cross-page navigation (matches the funnel pages) ---------------- */
  const NAV = (() =&gt; {
    const A = {
      event:    &quot;https://claude.ai/code/artifact/77f4ef1f-f3a4-4ee2-b89b-02127d17edc5&quot;,
      login:    &quot;https://claude.ai/code/artifact/b0fd7a83-c8c8-43dd-84d9-41c1dc2a02f8&quot;,
    };
    const R = { event: &quot;bumpy-event-page-mockup.html&quot;, login: &quot;bumpy-login-mockup.html&quot; };
    const onArtifact = /(^|\.)claude\.ai$/.test(location.hostname);
    return (key) =&gt; {
      try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ bumpyNav: key }, &quot;*&quot;); return; } } catch (e) {}
      window.location.href = (onArtifact ? A : R)[key] || (onArtifact ? A.event : R.event);
    };
  })();

  const $ = (id) =&gt; document.getElementById(id);
  const toast = $(&quot;toast&quot;);
  function say(msg) {
    toast.textContent = msg; toast.classList.add(&quot;show&quot;);
    clearTimeout(toast._t); toast._t = setTimeout(() =&gt; toast.classList.remove(&quot;show&quot;), 2200);
  }

  let step = &quot;phone&quot;;               // &quot;phone&quot; | &quot;otp&quot;
  let dial = &quot;+66&quot;;
  let firstChannel = &quot;sms&quot;;         // phone-step choice: where the FIRST code goes (sms | whatsapp)
  let channel = &quot;sms&quot;;              // the channel the current code was sent on (sms | whatsapp | email)

  /* Demo account: a phone that already has an email on file unlocks the Email
     resend option (masked). Set to null to simulate an account with no email. */
  const account = { email: &quot;eldar@gmail.com&quot; };

  /* ---- Country code selector ---- */
  $(&quot;cc&quot;).addEventListener(&quot;change&quot;, (e) =&gt; {
    const [, flag, code] = e.target.value.split(&quot;|&quot;);
    $(&quot;cc-flag&quot;).textContent = flag;
    $(&quot;cc-code&quot;).textContent = code;
    dial = code;
    validatePhone();
  });

  /* ---- Phone-step channel selector: where the FIRST code gets sent ---- */
  const segSms = $(&quot;seg-sms&quot;), segWa = $(&quot;seg-wa&quot;);
  function setFirstChannel(ch) {
    firstChannel = ch;
    const isSms = ch === &quot;sms&quot;;
    segSms.classList.toggle(&quot;on&quot;, isSms);
    segWa.classList.toggle(&quot;on&quot;, !isSms);
    segSms.setAttribute(&quot;aria-checked&quot;, String(isSms));
    segWa.setAttribute(&quot;aria-checked&quot;, String(!isSms));
  }
  segSms.addEventListener(&quot;click&quot;, () =&gt; setFirstChannel(&quot;sms&quot;));
  segWa.addEventListener(&quot;click&quot;, () =&gt; setFirstChannel(&quot;whatsapp&quot;));

  /* ---- Phone step ---- */
  const numEl = $(&quot;num&quot;);
  const digits = (s) =&gt; (s.match(/\d/g) || []).join(&quot;&quot;);
  function validatePhone() {
    // demo rule: a plausible number is 6–14 digits
    const n = digits(numEl.value);
    const ok = n.length &gt;= 6 &amp;&amp; n.length &lt;= 14;
    $(&quot;continue&quot;).disabled = !ok;
    return ok;
  }
  numEl.addEventListener(&quot;input&quot;, () =&gt; {
    $(&quot;phone-wrap&quot;).classList.remove(&quot;bad&quot;);
    $(&quot;phone-err&quot;).textContent = &quot;&quot;;
    validatePhone();
  });

  function maskPhone() {
    const n = digits(numEl.value);
    const last2 = n.slice(-2);
    const bullets = &quot;•&quot;.repeat(Math.max(0, n.length - 2));
    // keep the last two digits together and unbroken
    return `${dial} ${bullets} ${last2}`.replace(/\s+/g, &quot; &quot;).trim();
  }

  const errIcon = '&lt;svg width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;path d=&quot;M12 7.5v5&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;16.3&quot; r=&quot;1&quot; fill=&quot;currentColor&quot;/&gt;&lt;/svg&gt;';

  $(&quot;phone-step&quot;).addEventListener(&quot;submit&quot;, (e) =&gt; {
    e.preventDefault();
    if (!digits(numEl.value)) {
      $(&quot;phone-wrap&quot;).classList.add(&quot;bad&quot;);
      $(&quot;phone-err&quot;).innerHTML = errIcon + &quot;Please enter your phone number&quot;;
      return;
    }
    if (!validatePhone()) {
      $(&quot;phone-wrap&quot;).classList.add(&quot;bad&quot;);
      $(&quot;phone-err&quot;).innerHTML = errIcon + &quot;Please enter a valid phone number&quot;;
      return;
    }
    // simulate reCAPTCHA + Twilio send
    const btn = $(&quot;continue&quot;);
    btn.disabled = true; btn.dataset.label = btn.textContent; btn.innerHTML = '&lt;span class=&quot;spin&quot;&gt;&lt;/span&gt;';
    setTimeout(() =&gt; {
      btn.textContent = btn.dataset.label || &quot;Continue&quot;;
      channel = firstChannel;   // the first code goes on the phone-step choice
      goStep(&quot;otp&quot;);
    }, 850);
  });

  /* ---- Step switching ---- */
  function goStep(next) {
    step = next;
    $(&quot;phone-step&quot;).hidden = next !== &quot;phone&quot;;
    $(&quot;otp-step&quot;).hidden = next !== &quot;otp&quot;;

    if (next === &quot;phone&quot;) {
      $(&quot;title&quot;).textContent = &quot;Log in or sign up&quot;;
      $(&quot;sub&quot;).textContent = &quot;Enter your phone number to continue&quot;;
      setFirstChannel(firstChannel);   // keep the phone-step selector in sync
    } else if (next === &quot;otp&quot;) {
      $(&quot;title&quot;).textContent = &quot;Log in or sign up&quot;;
      send(channel, false);            // first code goes out on the chosen channel
    }
    window.scrollTo({ top: 0, behavior: &quot;smooth&quot; });
  }

  /* ---- Back button: on OTP → phone; on phone → event page ---- */
  $(&quot;back&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    if (step === &quot;otp&quot;) goStep(&quot;phone&quot;);   // keep the chosen channel
    else NAV(&quot;event&quot;);
  });
  $(&quot;change-num&quot;).addEventListener(&quot;click&quot;, () =&gt; goStep(&quot;phone&quot;));

  /* ---- OTP inputs ---- */
  const otpInputs = [...$(&quot;otp&quot;).querySelectorAll(&quot;input&quot;)];
  function otpValue() { return otpInputs.map((i) =&gt; i.value).join(&quot;&quot;); }
  function refreshVerify() { $(&quot;verify&quot;).disabled = otpValue().length !== 6; }
  function resetOtp() { otpInputs.forEach((i) =&gt; (i.value = &quot;&quot;)); $(&quot;otp&quot;).classList.remove(&quot;bad&quot;); $(&quot;otp-err&quot;).textContent = &quot;&quot;; refreshVerify(); }

  otpInputs.forEach((inp, i) =&gt; {
    inp.addEventListener(&quot;input&quot;, () =&gt; {
      inp.value = inp.value.replace(/\D/g, &quot;&quot;).slice(0, 1);
      $(&quot;otp&quot;).classList.remove(&quot;bad&quot;); $(&quot;otp-err&quot;).textContent = &quot;&quot;;
      if (inp.value &amp;&amp; i &lt; otpInputs.length - 1) otpInputs[i + 1].focus();
      refreshVerify();
    });
    inp.addEventListener(&quot;keydown&quot;, (e) =&gt; {
      if (e.key === &quot;Backspace&quot; &amp;&amp; !inp.value &amp;&amp; i &gt; 0) otpInputs[i - 1].focus();
      if (e.key === &quot;ArrowLeft&quot; &amp;&amp; i &gt; 0) otpInputs[i - 1].focus();
      if (e.key === &quot;ArrowRight&quot; &amp;&amp; i &lt; otpInputs.length - 1) otpInputs[i + 1].focus();
    });
    inp.addEventListener(&quot;paste&quot;, (e) =&gt; {
      e.preventDefault();
      const d = (e.clipboardData.getData(&quot;text&quot;).match(/\d/g) || []).slice(0, 6);
      d.forEach((ch, k) =&gt; { if (otpInputs[k]) otpInputs[k].value = ch; });
      (otpInputs[d.length] || otpInputs[5]).focus();
      refreshVerify();
    });
  });

  $(&quot;otp-step&quot;).addEventListener(&quot;submit&quot;, (e) =&gt; {
    e.preventDefault();
    if (otpValue().length !== 6) {
      $(&quot;otp&quot;).classList.add(&quot;bad&quot;);
      $(&quot;otp-err&quot;).innerHTML = errIcon + &quot;Please enter the 6-digit verification code&quot;;
      return;
    }
    const btn = $(&quot;verify&quot;);
    btn.disabled = true; btn.dataset.label = btn.textContent; btn.innerHTML = '&lt;span class=&quot;spin&quot;&gt;&lt;/span&gt;';
    setTimeout(finishLogin, 900);   // demo: any 6 digits succeed
  });

  /* Authenticated — hand control back to wherever login was requested from.
     In the flow shell that's the &quot;redirect&quot; (e.g. checkout's Pay step); on its
     own it just returns to the event page. No success screen in between. */
  function finishLogin() {
    try {
      if (window.parent &amp;&amp; window.parent !== window) {
        window.parent.postMessage({ bumpyLoginDone: true }, &quot;*&quot;);
        return;
      }
    } catch (e) {}
    NAV(&quot;event&quot;);
  }

  /* ---- Channel model ---------------------------------------------------
     Every channel is shown as a bubble under &quot;Resend in 0:47 via&quot;. A single
     countdown in that label gates them all — no channel is tappable until it
     runs out. Email appears only when the account has one. */
  const ICO_WA = '&lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;currentColor&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12.04 2.5a9.5 9.5 0 0 0-8.1 14.42L2.5 21.5l4.7-1.4A9.5 9.5 0 1 0 12.04 2.5Zm0 1.7a7.8 7.8 0 0 1 6.6 11.95c-.2.32-.14.29-.6 2.02l-1.98-.52-.36.21a7.8 7.8 0 1 1-3.66-13.66Zm-3.2 3.6c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.02 0 1.2.87 2.35.99 2.51.12.16 1.7 2.72 4.19 3.71 2.07.82 2.49.66 2.94.62.45-.04 1.45-.59 1.66-1.17.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28-.24-.12-1.45-.72-1.67-.8-.22-.08-.39-.12-.55.12-.16.24-.63.8-.77.96-.14.16-.28.18-.52.06-.24-.12-1.03-.38-1.96-1.21-.72-.64-1.21-1.44-1.35-1.68-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.34-.76-1.83-.2-.47-.4-.41-.55-.42h-.47Z&quot;/&gt;&lt;/svg&gt;';
  const ICO_SMS = '&lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 16.5H9l-4.5 3v-3H4A1.5 1.5 0 0 1 2.5 15V7A1.5 1.5 0 0 1 4 5.5Z&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;path d=&quot;M7.5 10.5h.01M12 10.5h.01M16.5 10.5h.01&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/svg&gt;';
  const ICO_MAIL = '&lt;svg width=&quot;17&quot; height=&quot;17&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;5.5&quot; width=&quot;18&quot; height=&quot;13&quot; rx=&quot;2&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot;/&gt;&lt;path d=&quot;M4 7l8 6 8-6&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;';

  function maskEmail(e) {
    const [user, domain] = e.split(&quot;@&quot;);
    return `${user.slice(0, 1)}•••@${domain}`;
  }
  const CHANNELS = {
    whatsapp: { cls: &quot;wa&quot;,    ico: ICO_WA,   label: () =&gt; &quot;WhatsApp&quot; },
    sms:      { cls: &quot;sms&quot;,   ico: ICO_SMS,  label: () =&gt; &quot;SMS&quot; },
    email:    { cls: &quot;email&quot;, ico: ICO_MAIL, label: () =&gt; maskEmail(account.email) },
  };
  function availableChannels() {
    const all = [&quot;whatsapp&quot;, &quot;sms&quot;];
    if (account.email) all.push(&quot;email&quot;);
    return all;
  }
  function channelSub(ch) {
    return ch === &quot;whatsapp&quot; ? &quot;Enter the verification code sent via WhatsApp&quot;
         : ch === &quot;email&quot;    ? &quot;Enter the verification code sent to your email&quot;
         : &quot;Enter the verification code sent via SMS&quot;;
  }
  function sentTo(ch) { return ch === &quot;email&quot; ? maskEmail(account.email) : maskPhone(); }
  function sendToast(ch) {
    return ch === &quot;whatsapp&quot; ? &quot;New code sent via WhatsApp&quot;
         : ch === &quot;email&quot;    ? &quot;New code sent to your email&quot;
         : &quot;New code sent via SMS&quot;;
  }

  /* Repaint everything the OTP step derives from `channel`. */
  function paintOtp() {
    $(&quot;sub&quot;).textContent = channelSub(channel);
    $(&quot;masked&quot;).textContent = sentTo(channel);
    renderChannels();
  }

  /* ---- Shared resend cooldown -------------------------------------------
     One timer for the whole step: sending a code on any channel blocks every
     channel until it runs out, so you can't dodge the wait by hopping from
     WhatsApp to SMS. It counts down in the &quot;Resend in 0:47 via&quot; label. */
  const COOLDOWN = 60;
  let cooldown = 0;
  let ticker = null;
  function fmtCd(s) { const m = Math.floor(s / 60), ss = s % 60; return `${m}:${String(ss).padStart(2, &quot;0&quot;)}`; }

  function startTicker() {
    if (ticker) return;
    ticker = setInterval(() =&gt; {
      if (cooldown &gt; 0) cooldown--;
      paintChannels();
      if (cooldown &lt;= 0) { clearInterval(ticker); ticker = null; }
    }, 1000);
  }

  /* One bubble per available channel. Built when the channel set/current changes;
     the countdown label + disabled state refresh each tick. */
  const channelsEl = $(&quot;channels&quot;);
  function renderChannels() {
    channelsEl.innerHTML = availableChannels().map((c) =&gt; {
      const info = CHANNELS[c];
      return `&lt;button type=&quot;button&quot; class=&quot;alt ${info.cls}&quot; data-ch=&quot;${c}&quot;&gt;&lt;span class=&quot;ico&quot;&gt;${info.ico}&lt;/span&gt;&lt;span class=&quot;alt-label&quot;&gt;${info.label()}&lt;/span&gt;&lt;/button&gt;`;
    }).join(&quot;&quot;);
    channelsEl.querySelectorAll(&quot;.alt&quot;).forEach((b) =&gt;
      b.addEventListener(&quot;click&quot;, () =&gt; { if (cooldown &lt;= 0) send(b.dataset.ch, true); }));
    paintChannels();
  }
  function paintChannels() {
    const blocked = cooldown &gt; 0;
    $(&quot;resend-lbl&quot;).innerHTML = blocked
      ? `Resend in &lt;span class=&quot;cd&quot;&gt;${fmtCd(cooldown)}&lt;/span&gt; via`
      : &quot;Resend via&quot;;
    $(&quot;resend-lbl&quot;).setAttribute(&quot;aria-label&quot;, blocked
      ? `Resend available in ${cooldown} seconds`
      : &quot;Resend via&quot;);
    channelsEl.querySelectorAll(&quot;.alt&quot;).forEach((b) =&gt; {
      const c = b.dataset.ch;
      b.disabled = blocked;
      b.classList.toggle(&quot;current&quot;, c === channel);
      b.setAttribute(&quot;aria-label&quot;, blocked
        ? `Resend via ${CHANNELS[c].label()} available in ${cooldown} seconds`
        : `Resend via ${CHANNELS[c].label()}`);
      if (c === channel) b.setAttribute(&quot;aria-current&quot;, &quot;true&quot;); else b.removeAttribute(&quot;aria-current&quot;);
    });
  }

  /* Send (or resend) a code on a channel; restarts the shared cooldown. */
  function send(ch, announce) {
    channel = ch;
    cooldown = COOLDOWN;
    paintOtp();
    resetOtp();
    startTicker();
    setTimeout(() =&gt; otpInputs[0].focus(), announce ? 30 : 40);
    if (announce) say(sendToast(ch));
  }

  validatePhone();
&lt;/script&gt;

  // Producer descriptor = the top 1–2 categories across all their events. No genre
  // to write, no AI to guess — it stays correct as they post events, and matches
  // however the producer's events are actually categorised (community, food, …).
  (() =&gt; {
    const freq = {};
    [...UP, ...PAST].forEach(e =&gt; { if (e.cat) freq[e.cat] = (freq[e.cat] || 0) + 1; });
    const top = Object.entries(freq).sort((a,b) =&gt; b[1]-a[1]).slice(0,2).map(x =&gt; x[0]);
    const meta = document.getElementById('meta');
    top.forEach(c =&gt; { const s = document.createElement('span'); s.textContent = c; meta.appendChild(s); });
  })();
  const PIN = '&lt;svg width=&quot;12&quot; height=&quot;12&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;2.3&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot;/&gt;&lt;/svg&gt;';
  const card = (e,past)=&gt;`
    &lt;div class=&quot;card ${past?'past':''}&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Open ${e.t}&quot;&gt;
      &lt;div class=&quot;art&quot;&gt;
        &lt;!-- no loading=&quot;lazy&quot;: the bytes are already inline, so there is no request to
             defer — it only delays decode and can leave the card blank --&gt;
        &lt;img src=&quot;data:image/webp;base64,${e.img}&quot; alt=&quot;${e.t} poster&quot; decoding=&quot;async&quot;&gt;
        &lt;div class=&quot;date-chip&quot;&gt;&lt;div class=&quot;d&quot;&gt;${e.d}&lt;/div&gt;&lt;div class=&quot;m&quot;&gt;${e.m}&lt;/div&gt;&lt;/div&gt;
        ${e.sold?'&lt;div class=&quot;status sold&quot;&gt;Sold out&lt;/div&gt;':''}
      &lt;/div&gt;
      &lt;div class=&quot;body&quot;&gt;
        &lt;h3&gt;${e.t}&lt;/h3&gt;
        &lt;div class=&quot;v&quot;&gt;${e.v}&lt;/div&gt;
        &lt;div class=&quot;loc&quot;&gt;${PIN}${e.loc}&lt;/div&gt;
        &lt;div class=&quot;p&quot;&gt;${e.from?'&lt;small&gt;From&lt;/small&gt; ':''}${e.p} &lt;small&gt;THB&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;

  // tabs — Upcoming / Past both clickable, swap the single grid
  const grid = document.getElementById('grid');
  const tabs = [...document.querySelectorAll('.tab')];
  function render(which){
    const list = which === 'past' ? PAST : UP;
    grid.innerHTML = list.map(e =&gt; card(e, which === 'past')).join('');
    tabs.forEach(t =&gt; t.classList.toggle('on', t.dataset.tab === which));
  }
  tabs.forEach(t =&gt; t.addEventListener('click', () =&gt; render(t.dataset.tab)));

  // whole card is the click target → the event page (same full-cell affordance as WHERE)
  function goEvent(){
    try{ if(window.parent &amp;&amp; window.parent!==window){ window.parent.postMessage({bumpyNav:'event'},'*'); return; } }catch(e){}
    window.location.href = 'bumpy-event-page-mockup.html';
  }
  grid.addEventListener('click', e =&gt; { if (e.target.closest('.card')) goEvent(); });
  grid.addEventListener('keydown', e =&gt; { const c = e.target.closest('.card'); if (c &amp;&amp; (e.key==='Enter' || e.key===' ')){ e.preventDefault(); goEvent(); } });

  render('up');
  // header/footer navigation (logo -&gt; home, login, footer links)
  function PNAV(key){
    try{ if(window.parent &amp;&amp; window.parent!==window){ window.parent.postMessage({bumpyNav:key},&quot;*&quot;); return; } }catch(e){}
    var R={home:&quot;bumpy-home-mockup.html&quot;,event:&quot;bumpy-event-page-mockup.html&quot;,login:&quot;bumpy-login-mockup.html&quot;,partner:&quot;bumpy-partner-mockup.html&quot;,contact:&quot;bumpy-contact-mockup.html&quot;,about:&quot;bumpy-about-mockup.html&quot;};
    if(R[key]) window.location.href=R[key];
  }
  document.querySelectorAll('[data-nav]').forEach(function(el){el.addEventListener('click',function(e){e.preventDefault();PNAV(el.dataset.nav);});});
&lt;/script&gt;
